let hands,mpCamera;async function startHands(){if(!window.Hands){alert('MediaPipe Hands 加载失败，请刷新后重试。');return}hands=new Hands({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.62,minTrackingConfidence:.62});hands.onResults(onHands);mpCamera=new Camera(cameraVideo,{onFrame:async()=>hands.send({image:cameraVideo}),width:640,height:480});await mpCamera.start();document.querySelector('#camBtn').textContent='手势控制已开启'}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function classify(lm){const wrist=lm[0],tips=[8,12,16,20],pips=[6,10,14,18],extended=tips.map((t,i)=>dist(lm[t],wrist)>dist(lm[pips[i]],wrist)*1.12),ext=extended.filter(Boolean).length,pinch=dist(lm[4],lm[8])<.065;if(pinch)return{type:'pinch',x:lm[8].x,y:lm[8].y};if(ext<=1)return{type:'fist',x:wrist.x,y:wrist.y};if(ext>=4)return{type:'open',x:wrist.x,y:wrist.y};return{type:'move',x:wrist.x,y:wrist.y}}
let lastGesture='none',stableSince=0;function onHands(res){const lm=res.multiHandLandmarks?.[0];if(!lm){gestureDot.style.display='none';return}gestureDot.style.display='block';const g=classify(lm),now=performance.now();gestureDot.style.left=(1-g.x)*innerWidth+'px';gestureDot.style.top=g.y*innerHeight+'px';if(g.type!==lastGesture){lastGesture=g.type;stableSince=now}const stable=now-stableSince>180;if(g.type==='open'&&stable&&state==='cake')setState('cloud');else if(g.type==='fist'&&stable&&state!=='cake')setState('cake');else if(g.type==='pinch'&&stable){if(state==='cloud'){let best=Infinity,bi=0;photos.forEach((p,i)=>{const v=p.position.clone().project(camera),dx=v.x*.5+.5-(1-g.x),dy=v.y*-.5+.5-g.y,d=Math.hypot(dx,dy);if(d<best){best=d;bi=i}});if(best<.35)setState('focus',bi)}}else if(g.type==='open'&&state==='cloud'){const dx=g.x-lastHand.x,dy=g.y-lastHand.y;scene.rotation.y+=dx*2.5;scene.rotation.x+=dy*1.2}else if(g.type==='pinch'&&state==='focus'){const target=photos[selected];if(target)gsap.to(target.position,{x:(.5-g.x)*5,y:(.5-g.y)*3+1.15,duration:.22,ease:'power2.out'})}else if(g.type==='move'&&state==='cloud'){scene.rotation.y+=(g.x-lastHand.x)*1.5;scene.rotation.x+=(g.y-lastHand.y)*.7}if(g.type!=='pinch'&&state==='focus'&&stable)setState('cloud');lastHand={x:g.x,y:g.y}}
document.querySelector('#camBtn').onclick=()=>startHands().catch(err=>alert('无法开启摄像头：'+err.message));
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();cakeGroup.rotation.y=Math.sin(t*.12)*.035;candleGroup.children.forEach(o=>{if(o.geometry?.type==='SphereGeometry'){o.scale.x=.72+Math.sin(t*7+o.userData.phase)*.08;o.scale.y=1.5+Math.sin(t*9+o.userData.phase)*.12}});key.intensity=58+Math.sin(t*7)*6+Math.sin(t*13)*3;particles.rotation.y=t*.012;sparks.rotation.y=-t*.06;photos.forEach(p=>{if(state==='cloud'){p.position.y+=Math.sin(t*.55+p.userData.seed)*.0015;p.rotation.z+=Math.sin(t*.3+p.userData.seed)*.00015}});composer.render()}
window.__birthdayBooted=true;clearTimeout(window.__birthdayBootTimer);loading.classList.add('hide');animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
</script>
