<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>JIXUANHANG · Birthday Star Cloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040b;color:#fff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:22px;left:50%;transform:translateX(-50%);text-align:center;letter-spacing:.2em;text-shadow:0 0 28px #bdeaff}.top small{font-size:10px;color:#9edfff}.top h1{margin:7px 0 0;font-weight:400;font-size:clamp(22px,3.8vw,48px)}.state{position:absolute;top:22px;right:22px;padding:9px 14px;border:1px solid #8bdcff55;border-radius:99px;background:#081224aa;backdrop-filter:blur(12px);font-size:11px;color:#c8edff}.bottom{position:absolute;left:20px;bottom:18px;pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap}.btn,label{padding:10px 14px;border:1px solid #9bdfff55;border-radius:99px;background:#081224cc;color:#e9f8ff;font-size:11px;cursor:pointer;box-shadow:0 0 20px #66caff12}input{display:none}.hint{position:absolute;right:20px;bottom:18px;text-align:right;font-size:10px;line-height:1.8;color:#a8cde3}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#02040b;z-index:20;transition:.8s}.loading.hide{opacity:0;pointer-events:none}.orb{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#fff,#bceaff 8%,#8a8cff 25%,transparent 65%);filter:blur(2px);box-shadow:0 0 90px #7ccfff}.loading p{text-align:center;font-size:12px;color:#b9dced}.cam{display:none}.countdown{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at center,#101936ee 0,#03050df5 52%,#010208 100%);transition:opacity .7s}.countdown.hide{opacity:0;pointer-events:none}.count{font-size:clamp(110px,25vw,280px);font-weight:200;line-height:1;letter-spacing:-.08em;color:#fff;text-shadow:0 0 20px #fff,0 0 55px #a8e7ff,0 0 120px #8a7cff;animation:countPulse .95s ease both}@keyframes countPulse{0%{opacity:0;transform:scale(1.45);filter:blur(12px)}35%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:.9;transform:scale(.86);filter:blur(2px)}}.countLabel{position:absolute;bottom:20%;font-size:11px;letter-spacing:.45em;color:#bcecff;text-transform:uppercase}.skip{position:absolute;right:22px;bottom:20px;padding:8px 12px;border:1px solid #8bdcff44;border-radius:99px;background:#081224aa;color:#bfeeff;font-size:10px;cursor:pointer;pointer-events:auto}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="top"><small>JIXUANHANG · MEMORY UNIVERSE</small><h1>HAPPY BIRTHDAY</h1></div><div class="state" id="state">生日星云 · 合拢态</div><div class="bottom"><button class="btn" id="reset">回到蛋糕</button><label>添加照片<input id="files" type="file" accept="image/*" multiple></label><button class="btn" id="hand">开启手势</button></div><div class="hint">张开五指：蛋糕粒子散开并出现照片<br>握拳：照片与粒子重新聚合　·　拖动：旋转空间<br>捏合：放大当前照片</div></div><video id="video" class="cam" playsinline></video><div class="loading" id="load"><div><div class="orb"></div><p>正在点亮生日星云…</p></div></div><div class="countdown" id="countdown"><div class="count" id="count">5</div><div class="countLabel">JIXUANHANG · BIRTHDAY MEMORY</div><button class="skip" id="skip">跳过倒数</button></div><script>(()=>{const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t;let mode='cake',rotY=0,rotX=.04,targetRotY=0,targetRotX=.04,focus=-1,drag=false,lx=0,ly=0,time=0,cloudStart=-999;const particles=[],photos=[],colors=['#e9fbff','#b8e6ff','#d9d0ff','#ffd6ed','#fff','#9de8ff'];function P(x,y,z,s,c,k='dust'){particles.push({x,y,z,s,c,k,ph:rnd(0,TAU),sx:x,sy:y,sz:z})}function makeCake(){particles.length=0;const tiers=[{r:1.62,y:-1.18,h:.62,n:1050},{r:1.28,y:-.46,h:.58,n:900},{r:.94,y:.22,h:.54,n:760}];tiers.forEach((t,ti)=>{for(let i=0;i<t.n;i++){const a=rnd(0,TAU),rr=t.r*Math.sqrt(Math.random()),y=t.y+rnd(-t.h/2,t.h/2);P(Math.cos(a)*rr,y,Math.sin(a)*rr,rnd(.25,.72),colors[(i+ti)%colors.length],'cake')}for(let i=0;i<260;i++){const a=rnd(0,TAU),rr=t.r+rnd(-.035,.035),y=t.y+rnd(-t.h/2,t.h/2);P(Math.cos(a)*rr,y,Math.sin(a)*rr,rnd(.3,.8),i%3?'#bfeaff':'#fff','rim')}});for(let i=0;i<300;i++){const a=rnd(0,TAU),r=1.66,y=-.72+Math.sin(a*8)*.08+rnd(-.05,.05);P(Math.cos(a)*r,y,Math.sin(a)*r,rnd(.25,.75),'#ffd9ee','icing')}for(let i=0;i<7;i++){const a=TAU*i/7,r=.66;for(let j=0;j<42;j++)P(Math.cos(a)*r,-.02+j*.045,Math.sin(a)*r,.42,'#f4e8ff','candle');for(let j=0;j<70;j++)P(Math.cos(a)*r+rnd(-.05,.05),1.08+rnd(-.03,.26),Math.sin(a)*r+rnd(-.05,.05),rnd(.32,.9),j%3?'#ffd36b':'#fff6c4','flame')}for(let i=0;i<190;i++){const a=TAU*i/190,r=.78*(.55+.45*Math.abs(Math.cos(2.5*a)));P(Math.cos(a)*r,1.45+Math.sin(a*2)*.1,Math.sin(a)*r,rnd(.35,.85),'#fff3bd','star')}const tc=document.createElement('canvas');tc.width=1100;tc.height=180;const t=tc.getContext('2d');t.fillStyle='#fff';t.font='bold 72px Arial';t.textAlign='center';t.fillText('HAPPY BIRTHDAY JIXUANHANG',550,105);const d=t.getImageData(0,0,tc.width,tc.height).data;for(let y=0;y<180;y+=5)for(let x=0;x<1100;x+=5)if(d[(y*1100+x)*4+3]>120)P((x-550)/160,(95-y)/160,-2.55,.52,'#ffd9ff','text')}makeCake();const files=['IMG_1313.webp','IMG_1504.webp','IMG_1757.webp','IMG_2147.webp','IMG_2244.webp','IMG_2350.webp','IMG_2423.webp','IMG_2592.webp','IMG_2700.webp'];function addPhoto(src){const img=new Image();img.src=src;const p={img,x:rnd(-6,6),y:rnd(-2.5,3.8),z:rnd(-1,5),s:0,ang:rnd(-.18,.18),ta:rnd(-.18,.18),loaded:false,alpha:0};img.onload=()=>p.loaded=true;photos.push(p)}files.forEach(f=>addPhoto('assets/'+f));function project(x,y,z){const cy=Math.cos(rotY),sy=Math.sin(rotY),cx=Math.cos(rotX),sx=Math.sin(rotX);let X=x*cy-z*sy,Z=x*sy+z*cy,Y=y*cx-Z*sx;Z=y*sx+Z*cx;const cam=10,scale=H*.105;return{x:W/2+X*scale/(1+Z/cam),y:H*.56-Y*scale/(1+Z/cam),z:Z}}function star(x,y,r,a,c){ctx.save();ctx.globalAlpha=a;ctx.shadowBlur=r*6;ctx.shadowColor=c;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore()}function bg(){const g=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.72);g.addColorStop(0,'#111b3c');g.addColorStop(.45,'#080d21');g.addColorStop(1,'#02040b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}function drawParticles(){const spread=mode==='cloud'||mode==='focus';const arr=particles.map(p=>{let ox=p.x,oy=p.y,oz=p.z;if(spread){const e=Math.min(1,(time-cloudStart)*.55);const ease=1-Math.pow(1-e,3);ox=lerp(p.x,p.x*2.6+Math.sin(p.ph+time*.55)*2.1,ease);oy=lerp(p.y,p.y*1.55+Math.cos(p.ph)*1.8,ease);oz=lerp(p.z,p.z*2.7+Math.sin(p.ph*1.7)*2,ease)}else{const e=1-Math.exp(-.04*(time+1));ox=lerp(p.x,p.sx,e);oy=lerp(p.y,p.sy,e);oz=lerp(p.z,p.sz,e)}const q=project(ox,oy,oz);return{p,q}}).sort((a,b)=>b.q.z-a.q.z);arr.forEach(({p,q})=>{const a=.5+.4*Math.sin(time*2+p.ph);star(q.x,q.y,Math.max(.22,p.s*(1.02-q.z*.02)),a,p.c)})}function drawPhotos(){if(mode==='cake')return;const reveal=Math.max(0,Math.min(1,(time-cloudStart-.35)*.9));photos.forEach((p,i)=>{if(!p.loaded)return;let ts=mode==='focus'&&i===focus?1.65:reveal;let tx=p.x,ty=p.y,tz=p.z;if(mode==='focus'&&i===focus){tx=0;ty=.45;tz=5}p.s=lerp(p.s,ts,.08);p.alpha=lerp(p.alpha,reveal,.08);p.ang=lerp(p.ang,mode==='focus'&&i===focus?0:p.ta,.06);if(p.s<.01)return;const q=project(tx,ty,tz),w=160*p.s*(H/900),h=118*p.s*(H/900);ctx.save();ctx.globalAlpha=p.alpha;ctx.translate(q.x,q.y);ctx.rotate(p.ang);ctx.shadowBlur=mode==='focus'&&i===focus?48:22;ctx.shadowColor='#a8dcff';ctx.fillStyle='#f7f4f0';ctx.fillRect(-w/2-5,-h/2-5,w+10,h+10);ctx.shadowBlur=0;ctx.drawImage(p.img,-w/2,-h/2,w,h);ctx.restore()})}function setMode(m,i=-1){mode=m;focus=i;if(m==='cloud')cloudStart=time;document.getElementById('state').textContent=m==='cake'?'生日星云 · 合拢态':m==='cloud'?'照片星云 · 散开态':'照片聚焦 · 记忆';if(m==='cake')photos.forEach(p=>{p.s=0;p.alpha=0})}function animate(){time+=.016;bg();rotY=lerp(rotY,targetRotY,.04);rotX=lerp(rotX,targetRotX,.04);drawParticles();drawPhotos();requestAnimationFrame(animate)}animate();function startCountdown(){const overlay=document.getElementById('countdown'),num=document.getElementById('count');let n=5;function tick(){num.textContent=n;num.style.animation='none';void num.offsetWidth;num.style.animation='countPulse .95s ease both';if(n===0){overlay.classList.add('hide');setTimeout(()=>overlay.remove(),800);return}n--;setTimeout(tick,1000)}tick()}startCountdown();document.getElementById('skip').onclick=()=>{document.getElementById('countdown').classList.add('hide');setTimeout(()=>document.getElementById('countdown')?.remove(),500)};document.getElementById('reset').onclick=()=>setMode('cake');document.getElementById('files').onchange=e=>{[...e.target.files].forEach(f=>addPhoto(URL.createObjectURL(f)));e.target.value=''};cv.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};onpointerup=()=>drag=false;onpointermove=e=>{if(drag){targetRotY+=(e.clientX-lx)*.006;targetRotX+=(e.clientY-ly)*.003;lx=e.clientX;ly=e.clientY}};cv.onclick=e=>{if(mode!=='cloud')return;let best=1,bi=-1;photos.forEach((p,i)=>{if(p.alpha<.3)return;let q=project(p.x,p.y,p.z),dd=Math.hypot(q.x-e.clientX,q.y-e.clientY)/Math.min(W,H);if(dd<best){best=dd;bi=i}});if(bi>=0)setMode('focus',bi)};document.getElementById('hand').onclick=async()=>{try{if(!window.Hands){await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js');await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js')}const video=document.getElementById('video'),stream=await navigator.mediaDevices.getUserMedia({video:true});video.srcObject=stream;await video.play();const hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.55,minTrackingConfidence:.55});hands.onResults(r=>{const l=r.multiHandLandmarks&&r.multiHandLandmarks[0];if(!l)return;const tips=[8,12,16,20],pips=[6,10,14,18],w=l[0],ext=tips.filter((t,i)=>Math.hypot(l[t].x-w.x,l[t].y-w.y)>Math.hypot(l[pips[i]].x-w.x,l[pips[i]].y-w.y)*1.1).length;const pinch=Math.hypot(l[4].x-l[8].x,l[4].y-l[8].y)<.06;if(pinch&&mode==='cloud'&&photos.length)setMode('focus',Math.floor(Math.random()*photos.length));else if(ext>=4&&mode==='cake')setMode('cloud');else if(ext<=1&&mode!=='cake')setMode('cake');else if(mode==='cloud'){targetRotY+=(l[9].x-.5)*.004;targetRotX+=(l[9].y-.5)*.002}});const cam=new Camera(video,{onFrame:async()=>hands.send({image:video}),width:640,height:480});cam.start();document.getElementById('hand').textContent='手势已开启'}catch(e){alert('请允许浏览器使用摄像头；鼠标仍可旋转和浏览照片')}};function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}})();</script></body></html>
