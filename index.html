<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>JIXUANHANG · Birthday Star Cloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;color:#fff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:22px;left:50%;transform:translateX(-50%);text-align:center;opacity:.82;letter-spacing:.18em;text-shadow:0 0 28px #bdeaff}.top small{font-size:9px;color:#b8e9ff}.top h1{margin:6px 0 0;font-size:clamp(20px,3.2vw,42px);font-weight:300}.state{position:absolute;top:22px;right:22px;padding:8px 12px;border:1px solid #9ce7ff44;border-radius:99px;background:#07102299;font-size:10px;color:#c9efff}.tools{position:absolute;left:20px;bottom:18px;display:flex;gap:8px;pointer-events:auto}.btn,label{border:1px solid #9ce7ff55;background:#071022cc;color:#e8f8ff;padding:9px 13px;border-radius:99px;font-size:10px;cursor:pointer}input{display:none}.hint{position:absolute;right:20px;bottom:18px;text-align:right;color:#9dbdd0;font-size:10px;line-height:1.8}.loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#02030a;transition:opacity .8s}.loading.hide{opacity:0;pointer-events:none}.loaderOrb{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#fff,#bcecff 7%,#899cff 25%,transparent 66%);box-shadow:0 0 100px #75d8ff;filter:blur(2px)}</style></head><body><canvas id="c"></canvas><div class="ui"><div class="top"><small>JIXUANHANG · MEMORY UNIVERSE</small><h1>HAPPY BIRTHDAY</h1></div><div class="state" id="state">生日倒数</div><div class="tools"><button class="btn" id="reset">重新开始</button><label>添加照片<input id="files" type="file" accept="image/*" multiple></label><button class="btn" id="hand">开启手势</button></div><div class="hint">🖐 张开：星云散开并出现照片<br>✊ 握拳：重新聚合　·　🤏 捏合：照片放大　·　拖动：旋转</div></div><video id="video" playsinline style="display:none"></video><div class="loading" id="loading"><div><div class="loaderOrb"></div></div></div><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const TAU=Math.PI*2,r=(a,b)=>a+Math.random()*(b-a),L=(a,b,t)=>a+(b-a)*t,cols=['#effcff','#bfe9ff','#d8d0ff','#ffd4eb','#fff7c9','#91ddff'];let scene='countdown',t=0,phase=0,rot=0,rx=.04,tr=0,tx=.04,down=false,px=0,py=0,focus=-1;const P=[],photos=[];function add(X,Y,Z,s,col,kind='cake'){P.push({x:X,y:Y,z:Z,s,col,kind,ph:r(0,TAU),ox:X,oy:Y,oz:Z})}function cake(){P.length=0;const tiers=[{R:1.62,Y:-1.15,H:.64,N:1250},{R:1.25,Y:-.47,H:.58,N:1050},{R:.90,Y:.20,H:.52,N:850}];tiers.forEach((q,k)=>{for(let i=0;i<q.N;i++){let a=r(0,TAU),rr=q.R*Math.sqrt(Math.random());add(Math.cos(a)*rr,q.Y+r(-q.H/2,q.H/2),Math.sin(a)*rr,r(.18,.46),cols[(i+k)%cols.length])}for(let i=0;i<240;i++){let a=r(0,TAU),rr=q.R+r(-.025,.025);add(Math.cos(a)*rr,q.Y+r(-q.H/2,q.H/2),Math.sin(a)*rr,r(.22,.48),i%2?'#c8ecff':'#fff','rim')}});for(let i=0;i<300;i++){let a=r(0,TAU),rr=1.64+r(-.04,.04);add(Math.cos(a)*rr,-.76+Math.sin(a*9)*.04+r(-.04,.04),Math.sin(a)*rr,r(.18,.42),'#ffd8ec','icing')}for(let i=0;i<7;i++){let a=i*TAU/7,rr=.64;for(let j=0;j<34;j++)add(Math.cos(a)*rr,-.03+j*.045,Math.sin(a)*rr,.28,'#e9e4ff','candle');for(let j=0;j<55;j++)add(Math.cos(a)*rr+r(-.04,.04),1.02+r(-.02,.25),Math.sin(a)*rr+r(-.04,.04),r(.18,.42),j%3?'#ffd26b':'#fff5bd','flame')}for(let i=0;i<220;i++){let a=i*TAU/220,rr=.72*(.58+.42*Math.abs(Math.cos(2.5*a)));add(Math.cos(a)*rr,1.47+Math.sin(a*2)*.08,Math.sin(a)*rr,r(.2,.5),'#fff0b7','star')}let tc=document.createElement('canvas');tc.width=1200;tc.height=160;let q=tc.getContext('2d');q.fillStyle='#fff';q.font='bold 62px Arial';q.textAlign='center';q.fillText('HAPPY BIRTHDAY JIXUANHANG',600,100);let d=q.getImageData(0,0,1200,160).data;for(let yy=0;yy<160;yy+=6)for(let xx=0;xx<1200;xx+=6)if(d[(yy*1200+xx)*4+3]>100)add((xx-600)/180,(95-yy)/180,-2.55,.3,'#ffd9f5','text')}cake();function sampleDigit(n){let q=document.createElement('canvas');q.width=300;q.height=400;let g=q.getContext('2d');g.fillStyle='#fff';g.font='bold 340px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(n,150,205);let d=g.getImageData(0,0,300,400).data,pts=[];for(let yy=0;yy<400;yy+=4)for(let xx=0;xx<300;xx+=4)if(d[(yy*300+xx)*4+3]>120)pts.push({x:(xx-150)/64,y:(200-yy)/64});return pts}let digit=[],digitParticles=[];function setDigit(n){digit=sampleDigit(n);digitParticles=Array.from({length:Math.max(1500,digit.length*2)},(_,i)=>{const target=digit[i%digit.length];const a=r(0,TAU),rad=r(2.8,5.2);return{x:Math.cos(a)*rad,y:Math.sin(a)*rad*.72,z:r(-2,2),tx:target.x+r(-.025,.025),ty:target.y+r(-.025,.025),tz:r(-.12,.12),ph:r(0,TAU),speed:r(.7,1.5)}})}function project(X,Y,Z){let cy=Math.cos(rot),sy=Math.sin(rot),cx=Math.cos(rx),sx=Math.sin(rx);let a=X*cy-Z*sy,b=X*sy+Z*cy,Y2=Y*cx-b*sx,Z2=Y*sx+b*cx,sc=H*.105,cam=10;return{x:W/2+a*sc/(1+Z2/cam),y:H*.56-Y2*sc/(1+Z2/cam),z:Z2}}function bg(){let g=x.createRadialGradient(W*.5,H*.48,0,W*.5,H*.5,Math.max(W,H)*.75);g.addColorStop(0,'#101a3a');g.addColorStop(.42,'#080d20');g.addColorStop(1,'#02030a');x.fillStyle=g;x.fillRect(0,0,W,H)}function dot(px,py,s,a,col){x.save();x.globalAlpha=Math.max(0,a);x.fillStyle=col;x.shadowColor=col;x.shadowBlur=Math.max(2,s*7);x.beginPath();x.arc(px,py,s,0,TAU);x.fill();x.restore()}function drawDigit(){if(!digitParticles.length)return;for(let i=0;i<digitParticles.length;i++){const p=digitParticles[i];const e=Math.min(1,phase*.92);const ease=e*e*(3-2*e);let swirl=t*p.speed+p.ph;let X=L(p.x,p.tx,ease)+Math.cos(swirl)*(.04+.12*(1-ease));let Y=L(p.y,p.ty,ease)+Math.sin(swirl*1.13)*(.04+.12*(1-ease));let Z=L(p.z,p.tz,ease)+Math.sin(swirl)*.12;let q=project(X,Y,Z);dot(q.x,q.y,.18+(i%4)*.035,.5+.35*Math.sin(t*2+p.ph),cols[i%cols.length])}}function drawCake(spread=false){let arr=P.map(p=>{let X=p.x,Y=p.y,Z=p.z;if(spread){let e=phase,ee=e*e*(3-2*e);X=L(p.x,p.x*2.5+Math.cos(p.ph+t*.35)*2.1,ee);Y=L(p.y,p.y*1.55+Math.sin(p.ph)*1.8,ee);Z=L(p.z,p.z*2.8+Math.cos(p.ph*1.4+t*.25)*2.2,ee)}return{p,q:project(X,Y,Z)}}).sort((a,b)=>b.q.z-a.q.z);arr.forEach(o=>{let p=o.p,q=o.q;dot(q.x,q.y,Math.max(.16,p.s*(1-q.z*.015)),.58+.28*Math.sin(t*1.7+p.ph),p.col)})}function drawPhotos(){if(scene==='countdown'||scene==='cake')return;let reveal=Math.min(1,phase);photos.forEach((p,i)=>{if(!p.img.complete)return;let X=p.x,Y=p.y,Z=p.z,S=reveal;if(scene==='focus'&&i===focus){X=0;Y=.45;Z=5;S=1.7}p.s=L(p.s,S,.075);let q=project(X,Y,Z),w=170*p.s*(H/900),h=122*p.s*(H/900);x.save();x.globalAlpha=Math.min(1,p.s);x.translate(q.x,q.y);x.rotate(p.a);x.shadowColor='#9edfff';x.shadowBlur=scene==='focus'&&i===focus?50:20;x.fillStyle='#fff';x.fillRect(-w/2-5,-h/2-5,w+10,h+10);x.shadowBlur=0;x.drawImage(p.img,-w/2,-h/2,w,h);x.restore()})}async function countdown(){scene='countdown';document.getElementById('state').textContent='生日倒数 · 粒子';for(let n=5;n>=1;n--){phase=0;setDigit(n);for(let k=0;k<55;k++){phase=Math.min(1,k/54);await new Promise(z=>setTimeout(z,16))}await new Promise(z=>setTimeout(z,260));for(let k=0;k<30;k++){phase=1-k/29;await new Promise(z=>setTimeout(z,12))}}phase=0;scene='cake';document.getElementById('state').textContent='生日星云 · 合拢态';photos.forEach(p=>p.s=0)}function setScene(s){scene=s;if(s==='cloud'){phase=0;document.getElementById('state').textContent='照片星云 · 散开';let st=t;let id=setInterval(()=>{phase=Math.min(1,(t-st)/1.7);if(phase>=1)clearInterval(id)},16)}if(s==='cake'){phase=0;photos.forEach(p=>p.s=0);document.getElementById('state').textContent='生日星云 · 合拢态'}}function loop(){t+=.016;bg();if(scene==='countdown')drawDigit();else drawCake(scene==='cloud'||scene==='focus');drawPhotos();rot=L(rot,tr,.05);rx=L(rx,tx,.05);requestAnimationFrame(loop)}loop();setTimeout(()=>document.getElementById('loading').classList.add('hide'),650);document.getElementById('reset').onclick=()=>countdown();const base=['IMG_1313.webp','IMG_1504.webp','IMG_1757.webp','IMG_2147.webp','IMG_2244.webp','IMG_2350.webp','IMG_2423.webp','IMG_2592.webp','IMG_2700.webp'];function photo(src){let im=new Image();im.src=src;photos.push({img:im,x:r(-6,6),y:r(-2.4,3.6),z:r(-1,5),s:0,a:r(-.2,.2)})}base.forEach(f=>photo('assets/'+f));document.getElementById('files').onchange=e=>{[...e.target.files].forEach(f=>photo(URL.createObjectURL(f)));e.target.value=''};c.onpointerdown=e=>{down=true;px=e.clientX;py=e.clientY};onpointerup=()=>down=false;onpointermove=e=>{if(!down||scene==='countdown')return;tr+=(e.clientX-px)*.006;tx+=(e.clientY-py)*.003;px=e.clientX;py=e.clientY};c.onclick=e=>{if(scene!=='cloud')return;let best=1,bi=-1;photos.forEach((p,i)=>{let q=project(p.x,p.y,p.z),dd=Math.hypot(q.x-e.clientX,q.y-e.clientY)/Math.min(W,H);if(dd<best&&p.s>.35){best=dd;bi=i}});if(bi>=0){focus=bi;setScene('focus')}};document.getElementById('hand').onclick=async()=>{try{if(!window.Hands){await load('https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js');await load('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js')}let v=document.getElementById('video'),stream=await navigator.mediaDevices.getUserMedia({video:true});v.srcObject=stream;await v.play();let h=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});h.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.55,minTrackingConfidence:.55});h.onResults(o=>{let l=o.multiHandLandmarks&&o.multiHandLandmarks[0];if(!l||scene==='countdown')return;let tips=[8,12,16,20],pips=[6,10,14,18],w=l[0],ext=tips.filter((q,i)=>Math.hypot(l[q].x-w.x,l[q].y-w.y)>Math.hypot(l[pips[i]].x-w.x,l[pips[i]].y-w.y)*1.1).length,pinch=Math.hypot(l[4].x-l[8].x,l[4].y-l[8].y)<.06;if(pinch&&scene==='cloud'&&photos.length){focus=Math.floor(Math.random()*photos.length);setScene('focus')}else if(ext>=4&&scene==='cake')setScene('cloud');else if(ext<=1&&scene!=='cake')setScene('cake');else if(scene==='cloud'){tr+=(l[9].x-.5)*.004}});await new Promise(z=>setTimeout(z,200));let stream2=v.srcObject;async function send(){if(v.readyState>=2)await h.send({image:v});requestAnimationFrame(send)}send();document.getElementById('hand').textContent='手势已开启'}catch(e){alert('手势需要允许摄像头；鼠标操作仍可用')}};function load(src){return new Promise((res,rej)=>{let s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}})();</script></body></html>
