{const e=smooth(cl(spread));ctx.globalCompositeOperation='lighter';for(let i=0;i<P.length;i++){const v=P[i];let a=v.x,b=v.y,z=v.z;if(spread){a=L(v.x,v.x*2.65+Math.cos(v.ph+tm*.45)*2.3,e);b=L(v.y,v.y*1.62+Math.sin(v.ph*1.3)*1.9,e);z=L(v.z,v.z*3+Math.sin(v.ph*1.7+tm*.3)*2.4,e)}const q=project(a,b,z);let al=.68+.25*Math.sin(tm*1.8+v.ph);if(v.k==='text')al=.95+.25*Math.sin(tm*2+v.ph);particle(q,Math.max(.045,v.s*(1-q.z*.012)),al,v.k==='text'?'#fff7fc':v.c)}ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}function drawPhotos(){if(mode!=='cloud'&&mode!=='focus')return;const e=smooth(cl(phase));for(let i=0;i<photos.length;i++){const p=photos[i];if(!p.img.complete)continue;let a=L(p.x,p.tx,e),b=L(p.y,p.ty,e),z=L(p.z,p.tz,e),s=e;if(mode==='focus'&&i===focus){a=0;b=.3;z=5;s=1.65}const q=project(a,b,z),w=170*s*(H/900),h=122*s*(H/900);ctx.save();ctx.globalAlpha=Math.min(1,s);ctx.translate(q.x,q.y);ctx.rotate(p.a);ctx.shadowColor='#ff9bd7';ctx.shadowBlur=mode==='focus'&&i===focus?35:16;ctx.fillStyle='#fff';ctx.fillRect(-w/2-5,-h/2-5,w+10,h+10);ctx.shadowBlur=0;ctx.drawImage(p.img,-w/2,-h/2,w,h);ctx.restore()}ctx.globalAlpha=1}const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function countdown(){mode='countdown';document.getElementById('state').textContent='粒子倒数';seedCloud(5);phase=0;for(let k=0;k<90;k++){phase=k/89;await sleep(14)}await sleep(350);for(let n=4;n>=1;n--){morphDigit(n);phase=0;for(let k=0;k<105;k++){phase=k/104;await sleep(13)}await sleep(260)}mode='burst';document.getElementById('state').textContent='粒子爆散';const st=performance.now();while(performance.now()-st<750){phase=(performance.now()-st)/750;await sleep(16)}mode='cake';spread=0;phase=0;document.getElementById('state').textContent='生日星云 · 蛋糕形成';try{birthdayAudio.currentTime=0;birthdayAudio.play().catch(()=>{})}catch(_){}for(let k=0;k<70;k++){phase=k/69;await sleep(16)}phase=0;photos.forEach(p=>p.s=0)}function openCloud(){if(mode!=='cake')return;mode='cloud';phase=0;spread=0;document.getElementById('state').textContent='粒子散开 · 照片出现';const st=performance.now();function f(){phase=cl((performance.now()-st)/2100);spread=phase;if(phase<1&&mode==='cloud')requestAnimationFrame(f)}requestAnimationFrame(f)}function backCake(){mode='cake';spread=0;phase=0;focus=-1;document.getElementById('state').textContent='生日星云 · 合拢态'}function focusPhoto(i){focus=i;mode='focus';document.getElementById('state').textContent='照片 · 放大记忆'}function loop(){tm+=.016;frame++;background();if(mode==='countdown')drawDigits();else if(mode==='cake'||mode==='cloud'||mode==='focus'){drawCake();drawPhotos()}else if(mode==='burst'){ctx.globalCompositeOperation='lighter';for(let i=0;i<750;i++){const a=i*TAU/750+tm*.42,rr=1+((i*17)%100)/100*6,q=project(Math.cos(a)*rr,Math.sin(a)*rr*.72,Math.sin(a*2+tm)*1.8);particle(q,.055,.58,'#ff9bd4')}ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}rot=L(rot,tr,.055);tilt=L(tilt,tt,.055);requestAnimationFrame(loop)}loop();const base=['IMG_1313.webp','IMG_1504.webp','IMG_1757.webp','IMG_2147.webp','IMG_2244.webp','IMG_2350.webp','IMG_2423.webp','IMG_2592.webp','IMG_2700.webp'];function addPhoto(src){const im=new Image();im.src=src;photos.push({img:im,x:R(-6,6),y:R(-2.7,3.7),z:R(-1,5),tx:R(-6,6),ty:R(-2.7,3.7),tz:R(-1,5),a:R(-.2,.2)})}base.forEach(f=>addPhoto('assets/'+f));document.getElementById('files').onchange=e=>{for(const f of e.target.files)addPhoto(URL.createObjectURL(f));e.target.value='';if(mode==='cake')openCloud()};let pointerQueued=false,queuedX=0,queuedY=0;C.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;C.setPointerCapture(e.pointerId)},{passive:true});C.addEventListener('pointerup',e=>{drag=false;try{C.releasePointerCapture(e.pointerId)}catch(_){}},{passive:true});C.addEventListener('pointercancel',()=>drag=false,{passive:true});C.addEventListener('pointermove',e=>{if(!drag||mode==='countdown')return;queuedX+=e.clientX-lx;queuedY+=e.clientY-ly;lx=e.clientX;ly=e.clientY;if(!pointerQueued){pointerQueued=true;requestAnimationFrame(()=>{tr+=queuedX*.004;tt+=queuedY*.002;queuedX=queuedY=0;pointerQueued=false})}},{passive:true});C.addEventListener('click',e=>{if(mode!=='cloud')return;let best=Infinity,bi=-1;for(let i=0;i<photos.length;i++){const p=photos[i],q=project(p.x,p.y,p.z),dd=Math.hypot(q.x-e.clientX,q.y-e.clientY);if(dd<best&&dd<Math.min(W,H)*.18){best=dd;bi=i}}if(bi>=0)focusPhoto(bi)});document.getElementById('startBtn').onclick=()=>{document.getElementById('start').classList.add('off');countdown()};document.getElementById('restart').onclick=()=>{birthdayAudio.pause();birthdayAudio.currentTime=0;document.getElementById('start').classList.remove('off');mode='idle';document.getElementById('state').textContent='等待点亮'};document.getElementById('hand').onclick=async()=>{try{if(!window.Hands){await load('https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js');await load('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js')}const v=document.getElementById('video');v.srcObject=await navigator.mediaDevices.getUserMedia({video:true});await v.play();const h=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});h.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.55});h.onResults(o=>{const l=o.multiHandLandmarks&&o.multiHandLandmarks[0];if(!l||mode==='countdown'||mode==='burst')return;const tips=[8,12,16,20],pips=[6,10,14,18],w=l[0],ext=tips.filter((q,i)=>Math.hypot(l[q].x-w.x,l[q].y-w.y)>Math.hypot(l[pips[i]].x-w.x,l[pips[i]].y-w.y)*1.1).length,pinch=Math.hypot(l[4].x-l[8].x,l[4].y-l[8].y)<.06;if(pinch&&mode==='cloud'&&photos.length){focus=Math.floor(Math.random()*photos.length);mode='focus';document.getElementById('state').textContent='照片 · 放大记忆'}else if(ext>=4&&mode==='cake')openCloud();else if(ext<=1&&mode!=='cake')backCake();else if(mode==='cloud'){tr+=(l[9].x-.5)*.002}});const send=async()=>{if(v.readyState>=2)await h.send({image:v});requestAnimationFrame(send)};send();document.getElementByI
