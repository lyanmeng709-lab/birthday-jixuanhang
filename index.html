<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JIXUANHANG · Countdown / Cake Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020106;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.cover{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:radial-gradient(circle at 50% 48%,#260b25,#08030d 58%,#020106);transition:opacity .7s}.cover.hide{opacity:0;pointer-events:none}.panel{text-align:center}.ey{font-size:10px;letter-spacing:.42em;color:#ffc5e7}.panel h1{margin:15px 0 10px;font-weight:300;letter-spacing:.12em;font-size:clamp(34px,6.5vw,76px);text-shadow:0 0 32px #ff62ba}.panel p{margin:0 0 28px;color:#cdb8c7;font-size:12px}.panel button,.bottom button{border:1px solid #ffacd888;background:#ff59b518;color:#fff;border-radius:999px;padding:13px 26px;letter-spacing:.14em;cursor:pointer;box-shadow:0 0 34px #ff59b533}.hud{position:fixed;z-index:2;inset:0;pointer-events:none}.brand{position:absolute;left:50%;top:16px;transform:translateX(-50%);text-align:center;text-shadow:0 0 25px #ff8fcd}.brand small{font-size:9px;letter-spacing:.16em;color:#f5bedc}.brand b{display:block;margin-top:4px;font-size:25px;font-weight:300}.state{position:absolute;right:16px;top:16px;padding:7px 10px;border-radius:20px;border:1px solid #ffb2dc44;background:#130915aa;font-size:10px;color:#f7cde4}.bottom{position:absolute;left:16px;bottom:16px;pointer-events:auto}.bottom button{padding:8px 12px;font-size:10px}.hint{position:absolute;right:16px;bottom:16px;color:#c5b3c2;font-size:10px;line-height:1.8;text-align:right}.badge{position:absolute;left:50%;top:84%;transform:translateX(-50%);font-size:11px;color:#f3c2dd;letter-spacing:.12em;opacity:.9}</style></head><body><canvas id="scene"></canvas><div class="cover" id="cover"><div class="panel"><div class="ey">JIXUANHANG · MEMORY UNIVERSE</div><h1>HAPPY BIRTHDAY</h1><p>测试版 · 数字 / 蛋糕 / 粒子流程</p><button id="start">点亮生日星云 ★</button></div></div><div class="hud"><div class="brand"><small>JIXUANHANG · MEMORY UNIVERSE</small><b>HAPPY BIRTHDAY</b></div><div class="state" id="state">等待点亮</div><div class="bottom"><button id="reset">重新开始</button></div><div class="hint">滚轮：拉近 / 拉远<br>拖动：旋转观察</div><div class="badge" id="badge"></div></div><audio id="audio" preload="auto" src="audio/birthday.mp3"></audio><script>(()=>{const c=document.getElementById('scene'),ctx=c.getContext('2d',{alpha:false});const cover=document.getElementById('cover'),start=document.getElementById('start'),state=document.getElementById('state'),badge=document.getElementById('badge'),reset=document.getElementById('reset'),audio=document.getElementById('audio');let W=0,H=0,D=1,time=0,phase='idle',phaseStart=0,current=5,scale=1,rot=0,drag=false,lx=0,ly=0,particles=[],cake=[],title=[];const TAU=Math.PI*2,COL=['#fff9fc','#ffd6ea','#ff9bd3','#ffd66e','#e9c9ff'];function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize,{passive:true});resize();function clamp(v){return Math.max(0,Math.min(1,v))}function ease(v){return v*v*(3-2*v)}function project(x,y,z=0){const cy=Math.cos(rot),sy=Math.sin(rot),cx=Math.cos(rot*.35),sx=Math.sin(rot*.35),X=x*cy-z*sy,Z=x*sy+z*cy,Y=y*cx-Z*sx,cam=10,s=Math.min(W,H)*.17*scale/(1+Z/cam);return{x:W/2+X*s,y:H*.55-Y*s,z:Z,s}}function clear(){const g=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.5,Math.max(W,H)*.8);g.addColorStop(0,'#19091d');g.addColorStop(.45,'#09040f');g.addColorStop(1,'#020106');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<220;i++){ctx.globalAlpha=.05+.08*Math.sin(time*.7+i);ctx.fillStyle=i%7?'#ffb8dd':'#ffe9b2';ctx.fillRect(((i*83)%1000)/1000*W,((i*47)%1000)/1000*H,1,1)}ctx.globalAlpha=1}function glow(x,y,r,color,a=1){ctx.globalAlpha=a;const g=ctx.createRadialGradient(x,y,0,x,y,r*7);g.addColorStop(0,'#fff');g.addColorStop(.2,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*7,0,TAU);ctx.fill();ctx.globalAlpha=1}function sampleDigit(n){const q=document.createElement('canvas');q.width=500;q.height=640;const g=q.getContext('2d');g.clearRect(0,0,q.width,q.height);g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font='900 520px Arial Black,Arial,sans-serif';g.fillText(String(n),250,330);const d=g.getImageData(0,0,q.width,q.height).data,out=[];for(let y=0;y<q.height;y+=3)for(let x=0;x<q.width;x+=3)if(d[(y*q.width+x)*4+3]>90)out.push({x:(x-250)/82,y:(325-y)/82});return out}function buildDigit(n){const t=sampleDigit(n);particles=Array.from({length:5200},(_,i)=>{const q=t[(i*17+Math.floor(i/41))%t.length],a=Math.random()*TAU,r=4.8+Math.random()*2.8;return{sx:Math.cos(a)*r,sy:Math.sin(a)*r*.72,tx:q.x,ty:q.y,tz:(Math.random()-.5)*.12,z:Math.random()-.5,size:.20+Math.random()*.12,color:COL[i%COL.length]}})}function drawParticles(){const u=ease(clamp((performance.now()-phaseStart)/950));particles.forEach(p=>{const q=project(p.sx+(p.tx-p.sx)*u,p.sy+(p.ty-p.sy)*u,p.z+(p.tz-p.z)*u);glow(q.x,q.y,p.size,p.color,.82)})}function cakeShape(){const arr=[];const tiers=[{r:2.15,y:-1.15,h:.72,n:3800,c:'#fff3f8'},{r:1.62,y:-.47,h:.62,n:3200,c:'#ffddeb'},{r:1.12,y:.18,h:.55,n:2600,c:'#fff9fc'}];tiers.forEach((t,k)=>{for(let i=0;i<t.n;i++){const a=Math.random()*TAU,rr=t.r*Math.sqrt(Math.random());arr.push({x:Math.cos(a)*rr,y:t.y+(Math.random()-.5)*t.h,z:Math.sin(a)*rr,size:.11+Math.random()*.10,color:t.c})}for(let i=0;i<760;i++){const a=i*TAU/760,rr=t.r+.01;arr.push({x:Math.cos(a)*rr,y:t.y+t.h*.47+.045*Math.sin(a*12),z:Math.sin(a)*rr,size:.08,color:k===1?'#fff':'#ffd4e8'})}});for(let i=0;i<18;i++){const a=i*TAU/18,rr=1.42;for(let j=0;j<65;j++)arr.push({x:Math.cos(a)*rr+(Math.random()-.5)*.08,y:.18+Math.random()*.25,z:Math.sin(a)*rr+(Math.random()-.5)*.08,size:.10,color:'#ff6c9d'})}for(let i=0;i<7;i++){const a=i*TAU/7,rr=.64;for(let j=0;j<90;j++)arr.push({x:Math.cos(a)*rr+(Math.random()-.5)*.03,y:.82+j*.006,z:Math.sin(a)*rr+(Math.random()-.5)*.03,size:.07,color:j%2?'#f4c0d6':'#ffd76c'});for(let j=0;j<80;j++)arr.push({x:Math.cos(a)*rr+(Math.random()-.5)*.1,y:1.35+Math.random()*.25,z:Math.sin(a)*rr+(Math.random()-.5)*.1,size:.075,color:'#ffd66d'})}return arr}function textShape(){const q=document.createElement('canvas');q.width=1400;q.height=170;const g=q.getContext('2d');g.fillStyle='#fff';g.font='900 72px Georgia,"Times New Roman",serif';g.textAlign='center';g.textBaseline='middle';g.fillText('HAPPY BIRTHDAY JIXUANHANG',700,85);const d=g.getImageData(0,0,q.width,q.height).data,out=[];for(let y=0;y<q.height;y+=3)for(let x=0;x<q.width;x+=3)if(d[(y*q.width+x)*4+3]>100)out.push({x:(x-700)/185,y:-.88,z:(y-85)/55-2.75,size:.055,color:'#ffe9a8'});return out}cake=cakeShape();title=textShape();function drawCake(){const u=ease(clamp((performance.now()-phaseStart)/1850));cake.forEach((p,i)=>{const a=i*.39,r=3.8*(1-u)+Math.hypot(p.x,p.z)*u;const q=project(Math.cos(a)*r*(1-u)+p.x*u,p.y*u+Math.sin(a*1.6)*1.4*(1-u),Math.sin(a)*r*(1-u)+p.z*u);glow(q.x,q.y,p.size,p.color,.8)});title.forEach(p=>{const q=project(p.x,p.y,p.z);glow(q.x,q.y,1.8,'#ffe7a8',.98)})}function drawBurst(){const u=clamp((performance.now()-phaseStart)/900);for(let i=0;i<1800;i++){const a=i*TAU/1800+time*.6,r=1.3+u*6.5;const q=project(Math.cos(a)*r,Math.sin(a)*r*.72,Math.sin(a*2+time)*1.6);glow(q.x,q.y,1.7,i%5?COL[i%COL.length]:'#fff',.55)}}function beginAudio(){audio.currentTime=0;audio.muted=true;audio.play().catch(()=>{})}function revealAudio(){audio.currentTime=0;audio.muted=false;audio.play().catch(()=>{})}function setState(t){state.textContent=t}function begin(){if(phase!=='idle')return;beginAudio();cover.classList.add('hide');current=5;buildDigit(current);phase='count';phaseStart=performance.now();setState('粒子倒数 · 5');badge.textContent='粒子汇聚'}start.onclick=begin;reset.onclick=()=>location.reload();c.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.65,Math.min(1.9,scale*(e.deltaY>0?.92:1.09)))},{passive:false});c.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;rot+=(e.clientX-lx)*.004;lx=e.clientX;ly=e.clientY});c.addEventListener('pointerup',()=>drag=false);function flow(now){clear();time+=.016;if(phase==='idle'){requestAnimationFrame(flow);return}if(phase==='count'){drawParticles();if(now-phaseStart>1250){if(current>1){current--;buildDigit(current);phaseStart=now;setState('粒子倒数 · '+current);badge.textContent='流动衔接'}else{phase='burst';phaseStart=now;setState('粒子爆散');badge.textContent='粒子爆散'}}}else if(phase==='burst'){drawBurst();if(now-phaseStart>950){phase='cake';phaseStart=now;setState('生日蛋糕 · 正在形成');badge.textContent='粒子聚合成蛋糕'}}else if(phase==='cake'){drawCake();if(now-phaseStart>1850){phase='done';revealAudio();setState('生日蛋糕 · 音乐播放');badge.textContent='HAPPY BIRTHDAY JIXUANHANG'}}else if(phase==='done'){cake.forEach(p=>{const q=project(p.x,p.y,p.z);glow(q.x,q.y,p.size,p.color,.75)});title.forEach(p=>{const q=project(p.x,p.y,p.z);glow(q.x,q.y,1.8,'#ffe7a8',.98)})}requestAnimationFrame(flow)}requestAnimationFrame(flow)})();</script></body></html>
