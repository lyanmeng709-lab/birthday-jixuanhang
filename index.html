<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>JIXUANHANG · Birthday Universe</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020107;color:#fff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 48%,#260b23,#09040f 48%,#020107);transition:opacity .7s}.start.off{opacity:0;pointer-events:none}.box{text-align:center}.ey{font-size:10px;letter-spacing:.4em;color:#ffb8df;margin-bottom:16px}.box h1{margin:0 0 10px;font-size:clamp(34px,6vw,72px);font-weight:200;letter-spacing:.12em;text-shadow:0 0 36px #ff65c5}.box p{margin:0 0 28px;color:#c9afc2;font-size:11px}.startbtn,.btn,label{border:1px solid #ffb0df88;border-radius:999px;padding:12px 22px;background:#ff4fae14;color:#fff;letter-spacing:.12em;font-size:11px;box-shadow:0 0 35px #ff4fae35;cursor:pointer}.hud{position:fixed;inset:0;pointer-events:none}.brand{position:absolute;top:18px;left:50%;transform:translateX(-50%);text-align:center;letter-spacing:.18em;text-shadow:0 0 24px #ff9bd7}.brand small{font-size:9px;color:#f6b9dc}.brand b{display:block;margin-top:5px;font-size:clamp(19px,3vw,38px);font-weight:300}.state{position:absolute;right:18px;top:18px;padding:7px 11px;border:1px solid #ffb7dd44;border-radius:99px;background:#100815aa;color:#f7cbe5;font-size:10px}.tools{position:absolute;left:18px;bottom:18px;display:flex;gap:7px;pointer-events:auto}.tools .btn,.tools label{padding:8px 12px;background:#100815cc}.hint{position:absolute;right:18px;bottom:18px;text-align:right;color:#c1aebc;font-size:10px;line-height:1.8}</style></head><body><canvas id="c"></canvas><div class="start" id="start"><div class="box"><div class="ey">JIXUANHANG · MEMORY UNIVERSE</div><h1>HAPPY BIRTHDAY</h1><p>点击按钮，开始一场由星尘组成的生日旅程</p><button class="startbtn" id="startBtn">点亮生日星云 ★</button></div></div><div class="hud"><div class="brand"><small>JIXUANHANG · MEMORY UNIVERSE</small><b>HAPPY BIRTHDAY</b></div><div class="state" id="state">等待点亮</div><div class="tools"><button class="btn" id="restart">重新开始</button><label>添加照片<input id="files" type="file" accept="image/*" multiple></label><button class="btn" id="hand">开启手势</button></div><div class="hint">🖐 张开手掌：粒子散开 · 照片出现<br>🤏 捏合：放大照片　·　✊ 握拳：回到蛋糕　·　拖动：旋转</div></div><video id="video" playsinline style="display:none"></video><audio id="birthdayAudio" preload="auto"></audio><script>(()=>{const C=document.getElementById('c'),ctx=C.getContext('2d',{alpha:false,desynchronized:true}),audio=document.getElementById('birthdayAudio');const AUDIO_URL='audio/birthday.mp3';audio.src=AUDIO_URL;audio.load();let audioPrimed=false;async function primeAudio(){try{audio.pause();audio.currentTime=0;audio.muted=true;audio.volume=1;await audio.play();audioPrimed=true;return true}catch(e){audioPrimed=false;return false}}function startBirthdayAudio(){audio.currentTime=0;audio.muted=false;audio.volume=1;const p=audio.play();if(p&&p.catch)p.catch(()=>{audioPrimed=false})}let W=innerWidth,H=innerHeight,D=1;function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize,{passive:true});resize();const TAU=Math.PI*2,R=(a,b)=>a+Math.random()*(b-a),L=(a,b,t)=>a+(b-a)*t,cl=v=>Math.max(0,Math.min(1,v)),ease=t=>t*t*(3-2*t),COL=['#fff8fc','#ffd2e9','#ff9bd5','#e8caff','#bce7ff','#fff0c2'];let mode='idle',time=0,phase=0,rot=0,tilt=.03,targetRot=0,targetTilt=.03,drag=false,lx=0,ly=0,cakeReveal=0,focus=-1;const cake=[],photos=[];function add(a,b,z,s,c,k='cake'){cake.push({a,b,z,s,c,k,ph:R(0,TAU)})}function buildCake(){cake.length=0;const tiers=[{r:1.72,y:-1.16,h:.64,n:3000},{r:1.32,y:-.48,h:.58,n:2600},{r:.96,y:.18,h:.52,n:2200}];tiers.forEach((q,k)=>{for(let i=0;i<q.n;i++){const ang=R(0,TAU),rr=q.r*Math.sqrt(Math.random());add(Math.cos(ang)*rr,q.y+R(-q.h/2,q.h/2),Math.sin(ang)*rr,R(.09,.22),COL[(i+k)%COL.length])}for(let i=0;i<360;i++){const ang=R(0,TAU);add(Math.cos(ang)*q.r,q.y+R(-q.h/2,q.h/2),Math.sin(ang)*q.r,R(.1,.24),i%2?'#ffd7eb':'#fff','rim')}});for(let i=0;i<460;i++){const ang=R(0,TAU),rr=1.72+R(-.04,.04);add(Math.cos(ang)*rr,-.78+Math.sin(ang*10)*.04+R(-.04,.04),Math.sin(ang)*rr,R(.1,.22),'#ffafd9','icing')}for(let i=0;i<7;i++){const ang=i*TAU/7,rr=.67;for(let j=0;j<32;j++)add(Math.cos(ang)*rr,-.02+j*.053,Math.sin(ang)*rr,.15,'#eadfff','candle');for(let j=0;j<60;j++)add(Math.cos(ang)*rr+R(-.04,.04),1.05+R(-.02,.28),Math.sin(ang)*rr+R(-.04,.04),R(.11,.28),j%4?'#ffd36b':'#fff4c2','flame')}for(let i=0;i<220;i++){const ang=i*TAU/220,rr=.76*(.58+.42*Math.abs(Math.cos(2.5*ang)));add(Math.cos(ang)*rr,1.5+Math.sin(ang*2)*.08,Math.sin(ang)*rr,R(.12,.28),'#fff0b6','star')}const tc=document.createElement('canvas');tc.width=1200;tc.height=180;const g=tc.getContext('2d');g.fillStyle='#fff';g.font='bold 66px Arial';g.textAlign='center';g.fillText('HAPPY BIRTHDAY JIXUANHANG',600,112);const d=g.getImageData(0,0,1200,180).data;for(let y=0;y<180;y+=5)for(let x=0;x<1200;x+=5)if(d[(y*1200+x)*4+3]>110)add((x-600)/175,(105-y)/175,-2.58,.4,'#fff7fc','text')}buildCake();const digitCanvas=document.createElement('canvas');digitCanvas.width=360;digitCanvas.height=440;const dg=digitCanvas.getContext('2d');function digit(n){dg.clearRect(0,0,360,440);dg.fillStyle='#fff';dg.font='bold 370px Arial';dg.textAlign='center';dg.textBaseline='middle';dg.fillText(n,180,222);const d=dg.getImageData(0,0,360,440).data,a=[];for(let y=0;y<440;y+=4)for(let x=0;x<360;x+=4)if(d[(y*360+x)*4+3]>120)a.push({x:(x-180)/68,y:(220-y)/68});return a}let targets=[],DP=[];function seed(n){targets=digit(n);DP=Array.from({length:2400},(_,i)=>{const b=targets[i%targets.length],a=R(0,TAU),rr=R(2.8,5.2);return{sx:Math.cos(a)*rr,sy:Math.sin(a)*rr*.72,sz:R(-.5,.5),tx:b.x+R(-.025,.025),ty:b.y+R(-.025,.025),tz:R(-.08,.08),ph:R(0,TAU),v:R(.6,1.1)}})}function morph(n){const next=digit(n),old=targets;DP=Array.from({length:2400},(_,i)=>{const a=old[i%old.length],b=next[(i*7+Math.floor(i/37))%next.length];return{sx:a.x,sy:a.y,sz:R(-.08,.08),tx:b.x+R(-.02,.02),ty:b.y+R(-.02,.02),tz:R(-.07,.07),bend:R(-.42,.42),ph:R(0,TAU),v:R(.55,1.05)}});targets=next}function project(a,b,z){const cy=Math.cos(rot),sy=Math.sin(rot),cx=Math.cos(tilt),sx=Math.sin(tilt),A=a*cy-z*sy,B=a*sy+z*cy,Y=b*cx-B*sx,Z=b*sx+B*cx,sc=H*.105,cam=10;return{x:W/2+A*sc/(1+Z/cam),y:H*.55-Y*sc/(1+Z/cam)}}const sprites={};function sprite(color){if(sprites[color])return sprites[color];const s=document.createElement('canvas');s.width=s.height=24;const g=s.getContext('2d'),gr=g.createRadialGradient(12,12,0,12,12,12);gr.addColorStop(0,'#fff');gr.addColorStop(.18,color);gr.addColorStop(1,'transparent');g.fillStyle=gr;g.fillRect(0,0,24,24);return sprites[color]=s}function dot(q,size,alpha,color){ctx.globalAlpha=alpha;ctx.drawImage(sprite(color),q.x-size*12,q.y-size*12,size*24,size*24)}const stars=Array.from({length:160},(_,i)=>({x:(i*83.17)%1,y:(i*47.31)%1,a:R(.08,.25),s:R(.25,.55)}));function background(){const g=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.5,Math.max(W,H)*.78);g.addColorStop(0,'#18091c');g.addColorStop(.4,'#09040f');g.addColorStop(1,'#010106');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';for(let i=0;i<stars.length;i++){const s=stars[i];ctx.globalAlpha=s.a+.05*Math.sin(time+i);ctx.fillStyle='#ffb8df';ctx.fillRect(s.x*W,s.y*H,s.s,s.s)}ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}function drawDigits(){const e=ease(phase);for(let i=0;i<DP.length;i++){const p=DP[i],bend=p.bend?Math.sin(e*Math.PI)*p.bend:0,q=project(L(p.sx,p.tx,e)+bend*Math.sin(e*Math.PI),L(p.sy,p.ty,e)-bend*Math.cos(e*Math.PI)*.45,L(p.sz,p.tz,e)+Math.sin(time*p.v+p.ph)*.04);dot(q,.055+(i%3)*.008,.72+.2*Math.sin(time*2+p.ph),COL[i%COL.length])}}function drawCake(){const e=ease(cakeReveal);ctx.globalCompositeOperation='lighter';for(let i=0;i<cake.length;i++){const p=cake[i];const a=L(0,p.a,e),b=L(0,p.b,e),z=L(0,p.z,e);const q=project(a,b,z);let alpha=.55+.35*Math.sin(time*1.7+p.ph);if(p.k==='text')alpha=1.15+.25*Math.sin(time*2+p.ph);dot(q,Math.max(.04,p.s*(.72+.28*e)),alpha,p.k==='text'?'#fff9fe':p.c)}ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}function drawBurst(){ctx.globalCompositeOperation='lighter';for(let i=0;i<850;i++){const a=i*TAU/850+time*.55,rr=1+((i*17)%100)/100*6.2,q=project(Math.cos(a)*rr,Math.sin(a)*rr*.72,Math.sin(a*2+time)*1.8);dot(q,.05,.58,'#ff9bd4')}ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}function drawPhotos(){if(mode!=='cloud'&&mode!=='focus')return;const e=ease(phase);for(let i=0;i<photos.length;i++){const p=photos[i];if(!p.img.complete)continue;let a=L(p.x,p.tx,e),b=L(p.y,p.ty,e),z=L(p.z,p.tz,e),s=e;if(mode==='focus'&&i===focus){a=0;b=.3;z=5;s=1.65}const q=project(a,b,z),w=170*s*(H/900),h=122*s*(H/900);ctx.save();ctx.globalAlpha=s;ctx.translate(q.x,q.y);ctx.rotate(p.a);ctx.shadowColor='#ff9bd7';ctx.shadowBlur=mode==='focus'&&i===focus?35:16;ctx.fillStyle='#fff';ctx.fillRect(-w/2-5,-h/2-5,w+10,h+10);ctx.shadowBlur=0;ctx.drawImage(p.img,-w/2,-h/2,w,h);ctx.restore()}ctx.globalAlpha=1}const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function countdown(){mode='countdown';document.getElementById('state').textContent='粒子倒数';seed(5);phase=0;for(let k=0;k<90;k++){phase=k/89;await sleep(14)}await sleep(320);for(let n=4;n>=1;n--){morph(n);phase=0;for(let k=0;k<105;k++){phase=k/104;await sleep(13)}await sleep(240)}mode='burst';phase=0;document.getElementById('state').textContent='粒子爆散';for(let k=0;k<52;k++){phase=k/51;await sleep(15)}mode='cake';cakeReveal=0;document.getElementById('state').textContent='生日星云 · 蛋糕形成';const start=performance.now();function reveal(){cakeReveal=cl((performance.now()-start)/1800);if(cakeReveal<1)requestAnimationFrame(reveal)}requestAnimationFrame(reveal);startBirthdayAudio();await sleep(1850);phase=0;photos.forEach(p=>p.s=0)}function openCloud(){if(mode!=='cake')return;mode='cloud';phase=0;const start=performance.now();function f(){phase=cl((performance.now()-start)/2100);if(phase<1&&mode==='cloud')requestAnimationFrame(f)}requestAnimationFrame(f);document.getElementById('state').textContent='粒子散开 · 照片出现'}function backCake(){mode='cake';cakeReveal=1;phase=0;focus=-1;document.getElementById('state').textContent='生日星云 · 合拢态'}function loop(){time+=.016;background();if(mode==='countdown')drawDigits();else if(mode==='burst')drawBurst();else if(mode==='cake'||mode==='cloud'||mode==='focus')drawCake(),drawPhotos();rot=L(rot,targetRot,.06);tilt=L(tilt,targetTilt,.06);requestAnimationFrame(loop)}loop();const base=['IMG_1313.webp','IMG_1504.webp','IMG_1757.webp','IMG_2147.webp','IMG_2244.webp','IMG_2350.webp','IMG_2423.webp','IMG_2592.webp','IMG_2700.webp'];function addPhoto(src){const im=new Image();im.src=src;photos.push({img:im,x:R(-6,6),y:R(-2.7,3.7),z:R(-1,5),tx:R(-6,6),ty:R(-2.7,3.7),tz:R(-1,5),a:R(-.2,.2)})}base.forEach(f=>addPhoto('assets/'+f));document.getElementById('files').onchange=e=>{for(const f of e.target.files)addPhoto(URL.createObjectURL(f));e.target.value=''};C.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;C.setPointerCapture(e.pointerId)},{passive:true});C.addEventListener('pointerup',()=>drag=false,{passive:true});C.addEventListener('pointermove',e=>{if(!drag||mode==='countdown'||mode==='burst')return;targetRot+=(e.clientX-lx)*.004;targetTilt+=(e.clientY-ly)*.002;lx=e.clientX;ly=e.clientY},{passive:true});C.addEventListener('click',e=>{if(mode!=='cloud')return;let best=Infinity,bi=-1;for(let i=0;i<photos.length;i++){const p=photos[i],q=project(p.x,p.y,p.z),d=Math.hypot(q.x-e.clientX,q.y-e.clientY);if(d<best&&d<Math.min(W,H)*.18){best=d;bi=i}}if(bi>=0){focus=bi;mode='focus';document.getElementById('state').textContent='照片 · 放大记忆'}});document.getElementById('startBtn').onclick=async()=>{await primeAudio();document.getElementById('start').classList.add('off');countdown()};document.getElementById('restart').onclick=()=>{audio.pause();audio.currentTime=0;document.getElementById('start').classList.remove('off');mode='idle';cakeReveal=0;document.getElementById('state').textContent='等待点亮'};document.getElementById('hand').onclick=async()=>{try{if(!window.Hands){await load('https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js');await load('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js')}const v=document.getElementById('video');v.srcObject=await navigator.mediaDevices.getUserMedia({video:true});await v.play();const h=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});h.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.55});h.onResults(o=>{const l=o.multiHandLandmarks&&o.multiHandLandmarks[0];if(!l||mode==='countdown'||mode==='burst')return;const tips=[8,12,16,20],pips=[6,10,14,18],w=l[0],ext=tips.filter((q,i)=>Math.hypot(l[q].x-w.x,l[q].y-w.y)>Math.hypot(l[pips[i]].x-w.x,l[pips[i]].y-w.y)*1.1).length,pinch=Math.hypot(l[4].x-l[8].x,l[4].y-l[8].y)<.06;if(pinch&&mode==='cloud'&&photos.length){focus=Math.floor(Math.random()*photos.length);mode='focus'}else if(ext>=4&&mode==='cake')openCloud();else if(ext<=1&&mode!=='cake')backCake();else if(mode==='cloud')targetRot+=(l[9].x-.5)*.002});const send=async()=>{if(v.readyState>=2)await h.send({image:v});requestAnimationFrame(send)};send();document.getElementById('hand').textContent='手势已开启'}catch(e){alert('手势需要允许摄像头；鼠标操作仍可用')}};function load(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}})();</script></body></html>
