<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JIXUANHANG · Birthday Universe</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020106;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle,#2a0b25,#09030e 58%,#020106);transition:opacity .7s}.hide{opacity:0;pointer-events:none}.box{text-align:center}.ey{font-size:10px;letter-spacing:.4em;color:#ffc3e5}.box h1{font-weight:200;letter-spacing:.12em;font-size:clamp(36px,7vw,76px);margin:15px 0 10px;text-shadow:0 0 35px #ff62bb}.box p{font-size:12px;color:#cbb5c5;margin-bottom:28px}.box button,.ui button{border:1px solid #ffacd888;background:#ff59b516;color:#fff;border-radius:30px;padding:12px 22px;letter-spacing:.12em;cursor:pointer}.ui{position:fixed;z-index:2;inset:0;pointer-events:none}.title{position:absolute;top:16px;left:50%;transform:translateX(-50%);text-align:center;letter-spacing:.14em;text-shadow:0 0 22px #ff86c8}.title small{font-size:9px}.title b{display:block;font-weight:300;font-size:25px;margin-top:5px}.state{position:absolute;right:16px;top:16px;font-size:10px;padding:7px 11px;border:1px solid #ffb3db44;border-radius:20px;background:#120814aa}.bottom{position:absolute;left:16px;bottom:16px;pointer-events:auto}.bottom button{padding:8px 12px;font-size:10px}</style></head><body><canvas id="c"></canvas><div class="start" id="start"><div class="box"><div class="ey">JIXUANHANG · MEMORY UNIVERSE</div><h1>HAPPY BIRTHDAY</h1><p>点击按钮，开始一场由星尘组成的生日旅程</p><button id="go">点亮生日星云 ★</button></div></div><div class="ui"><div class="title"><small>JIXUANHANG · MEMORY UNIVERSE</small><b>HAPPY BIRTHDAY</b></div><div class="state" id="state">等待点亮</div><div class="bottom"><button id="reset">重新开始</button></div></div><audio id="music" preload="auto" src="audio/birthday.mp3"></audio><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),audio=document.querySelector('#music'),start=document.querySelector('#start'),state=document.querySelector('#state');let W,H,D,mode='idle',t=0,prog=0,rot=0,targetRot=0,started=false;const TAU=Math.PI*2,colors=['#fff8fc','#ffd0e8','#ff98d3','#e8caff','#ffe9ad'];function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const dots=Array.from({length:170},(_,i)=>({x:(i*73)%1000/1000,y:(i*137)%1000/1000,a:.08+Math.random()*.16}));function bg(){const q=g.createRadialGradient(W/2,H*.48,0,W/2,H*.5,Math.max(W,H)*.8);q.addColorStop(0,'#18091d');q.addColorStop(.45,'#09040f');q.addColorStop(1,'#010105');g.fillStyle=q;g.fillRect(0,0,W,H);dots.forEach((p,i)=>{g.globalAlpha=p.a+.04*Math.sin(t+i);g.fillStyle='#ffb9dd';g.fillRect(p.x*W,p.y*H,1,1)});g.globalAlpha=1}function glow(x,y,r,col,a=1){const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,'#fff');q.addColorStop(.18,col);q.addColorStop(1,'transparent');g.globalAlpha=a;g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.globalAlpha=1}function pos(x,y,z){const co=Math.cos(rot),si=Math.sin(rot),X=x*co-z*si,Z=x*si+z*co,s=H*.105,k=10;return[W/2+X*s/(1+Z/k),H*.55-y*s/(1+Z/k)]}function numberPoints(n){const q=document.createElement('canvas');q.width=300;q.height=400;const z=q.getContext('2d');z.fillStyle='#fff';z.font='bold 340px Arial';z.textAlign='center';z.textBaseline='middle';z.fillText(n,150,205);const d=z.getImageData(0,0,300,400).data,a=[];for(let y=0;y<400;y+=5)for(let x=0;x<300;x+=5)if(d[(y*300+x)*4+3]>120)a.push([(x-150)/65,(200-y)/65]);return a}let pts=[];function seed(n){const target=numberPoints(n);pts=Array.from({length:2600},(_,i)=>{const q=target[i%target.length],a=Math.random()*TAU,r=3+Math.random()*3;return{x:Math.cos(a)*r,y:Math.sin(a)*r*.72,z:(Math.random()-.5),tx:q[0],ty:q[1],tz:(Math.random()-.5)*.12,p:Math.random()*TAU}})}function drawNums(){const e=prog*prog*(3-2*prog);pts.forEach((p,i)=>{const q=pos(p.x+(p.tx-p.x)*e,p.y+(p.ty-p.y)*e,p.z+(p.tz-p.z)*e);glow(q[0],q[1],2.6,colors[i%colors.length],.68+.12*Math.sin(p.p))})}function drawBurst(){for(let i=0;i<1500;i++){const a=i*TAU/1500+t*.72,r=1.2+(i%120)/120*6.5,q=pos(Math.cos(a)*r,Math.sin(a)*r*.72,Math.sin(a*2+t)*1.6);glow(q[0],q[1],1.8,i%3?'#ff9bd4':'#ffe9ad',.45)}}function drawCake(){const tiers=[[1.8,-1.05,.65],[1.4,-.38,.58],[1.02,.25,.5]];tiers.forEach((T,k)=>{for(let i=0;i<1150;i++){const a=i*TAU/1150+t*.025,rr=T[0]*Math.sqrt((i%1150)/1150),q=pos(Math.cos(a)*rr,T[1]+Math.sin(i*3)*.25,Math.sin(a)*rr);glow(q[0],q[1],2.1,colors[(i+k)%colors.length],.5)}});for(let i=0;i<900;i++){const a=i*TAU/900,r=1.82,q=pos(Math.cos(a)*r,-.72,Math.sin(a)*r);glow(q[0],q[1],1.8,'#ffadd7',.55)}for(let i=0;i<7;i++){const a=i*TAU/7,q=pos(Math.cos(a)*.65,.78,Math.sin(a)*.65);glow(q[0],q[1],9,'#ffd46b',.9)}drawText()}function drawText(){const q=document.createElement('canvas');q.width=1000;q.height=120;const z=q.getContext('2d');z.fillStyle='#fff';z.font='bold 52px Arial';z.textAlign='center';z.fillText('HAPPY BIRTHDAY JIXUANHANG',500,75);const d=z.getImageData(0,0,1000,120).data;for(let y=0;y<120;y+=5)for(let x=0;x<1000;x+=5)if(d[(y*1000+x)*4+3]>100){const p=pos((x-500)/155,-.15,(y-60)/45-2.3);glow(p[0],p[1],2.2,'#ffe9ad',.95)}}function loop(){t+=.016;bg();rot+=(targetRot-rot)*.06;if(mode==='count')drawNums();else if(mode==='burst')drawBurst();else if(mode==='cake')drawCake();requestAnimationFrame(loop)}loop();const wait=ms=>new Promise(r=>setTimeout(r,ms));const frameWait=ms=>new Promise(resolve=>{const s=performance.now();function f(n){if(n-s>=ms)resolve();else requestAnimationFrame(f)}requestAnimationFrame(f)});async function showDigit(n){seed(n);prog=0;const s=performance.now();while(performance.now()-s<950){prog=Math.min(1,(performance.now()-s)/700);await new Promise(requestAnimationFrame)}prog=1;await frameWait(180)}async function begin(){if(started)return;started=true;start.classList.add('hide');state.textContent='粒子倒数';audio.currentTime=0;audio.muted=true;audio.volume=1;try{await audio.play()}catch(e){}mode='count';for(let n=5;n>=1;n--){await showDigit(n)}state.textContent='粒子爆散';mode='burst';await frameWait(850);state.textContent='生日星云 · 蛋糕形成';mode='cake';prog=0;const s=performance.now();while(performance.now()-s<1800){prog=Math.min(1,(performance.now()-s)/1600);await new Promise(requestAnimationFrame)}prog=1;audio.currentTime=0;audio.muted=false;state.textContent='生日星云 · 音乐播放'}document.querySelector('#go').onclick=begin;document.querySelector('#reset').onclick=()=>location.reload();c.addEventListener('pointermove',e=>{if(e.buttons)targetRot+=(e.movementX||0)*.004});})();</script></body></html>
