<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JIXUANHANG · Birthday Universe</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020106;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle,#2d0c26,#09030e 58%,#020106);transition:opacity .7s}.start.hide{opacity:0;pointer-events:none}.box{text-align:center}.ey{font-size:10px;letter-spacing:.4em;color:#ffc3e5}.box h1{font-weight:200;letter-spacing:.12em;font-size:clamp(36px,7vw,76px);margin:15px 0 10px;text-shadow:0 0 35px #ff62bb}.box p{font-size:12px;color:#cbb5c5;margin-bottom:28px}.box button,.bottom button{border:1px solid #ffacd888;background:#ff59b516;color:#fff;border-radius:30px;padding:12px 22px;letter-spacing:.12em;cursor:pointer}.ui{position:fixed;z-index:2;inset:0;pointer-events:none}.title{position:absolute;top:16px;left:50%;transform:translateX(-50%);text-align:center;letter-spacing:.14em;text-shadow:0 0 22px #ff86c8}.title small{font-size:9px}.title b{display:block;font-weight:300;font-size:25px;margin-top:5px}.state{position:absolute;right:16px;top:16px;font-size:10px;padding:7px 11px;border:1px solid #ffb3db44;border-radius:20px;background:#120814aa}.bottom{position:absolute;left:16px;bottom:16px;pointer-events:auto}.bottom button{padding:8px 12px;font-size:10px}.zoom{position:absolute;right:16px;bottom:16px;font-size:10px;color:#cdb9c7}.zoom b{color:#ffe1f0}</style></head><body><canvas id="scene"></canvas><div class="start" id="start"><div class="box"><div class="ey">JIXUANHANG · MEMORY UNIVERSE</div><h1>HAPPY BIRTHDAY</h1><p>测试版 · 滚轮远近 / 拖动旋转</p><button id="begin">点亮生日星云 ★</button></div></div><div class="ui"><div class="title"><small>JIXUANHANG · MEMORY UNIVERSE</small><b>HAPPY BIRTHDAY</b></div><div class="state" id="state">等待点亮</div><div class="bottom"><button id="again">重新开始</button></div><div class="zoom">滚轮：<b>拉近 / 拉远</b>　拖动：<b>旋转</b></div></div><audio id="birthdayAudio" preload="auto"></audio><script src="countdown.js"></script><script src="birthday.js"></script><script src="audio.js"></script><script>(()=>{const c=document.getElementById('scene'),ctx=c.getContext('2d'),start=document.getElementById('start'),begin=document.getElementById('begin'),again=document.getElementById('again'),state=document.getElementById('state');BirthdayAudio.init(document.getElementById('birthdayAudio'));let w=innerWidth,h=innerHeight,d=1,zoom=1,rx=0,ry=0,drag=false,lx=0,ly=0,phase='idle',phaseT=0,particles=[],cake=[],title=[],burst=[];function resize(){w=innerWidth;h=innerHeight;d=Math.min(devicePixelRatio||1,1.5);c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function project(p){let x=p.x,y=p.y,z=p.z,cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),X=x*cy-z*sy,Z=x*sy+z*cy,Y=y*cx-Z*sx;Z=y*sx+Z*cx;const s=Math.min(w,h)*.19*zoom/(1+Z/10);return{x:w/2+X*s,y:h*.54-Y*s,z:Z}}function dot(p,a=1){const q=project(p),s=Math.max(.7,(p.size||.045)*Math.min(w,h)*.8/(1+q.z/12));ctx.globalAlpha=Math.max(0,a*(1-q.z/18));ctx.fillStyle=p.color||'#fff';ctx.shadowBlur=s*5;ctx.shadowColor=p.color||'#fff';ctx.beginPath();ctx.arc(q.x,q.y,s,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}function clear(){ctx.globalAlpha=1;const g=ctx.createRadialGradient(w/2,h*.52,0,w/2,h*.52,Math.max(w,h)*.72);g.addColorStop(0,'#1b091d');g.addColorStop(.45,'#08030d');g.addColorStop(1,'#020106');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let i=0;i<140;i++){ctx.globalAlpha=.12;ctx.fillStyle='#ffd0e7';ctx.fillRect((i*83%997)/997*w,(i*47%991)/991*h,1,1)}}function lerp(a,b,t){return a+(b-a)*t}function makeCount(n){return Countdown.build(n,3600).map(p=>({sx:p.sx,sy:p.sy,z:(Math.random()-.5)*.8,tx:p.tx,ty:p.ty,tz:(Math.random()-.5)*.15,size:.035+Math.random()*.03,color:['#fff','#ffd5e9','#ff9bd3','#ffe9a8'][Math.floor(Math.random()*4)]}))}function beginCount(){particles=makeCount(5);phase='count';phaseT=performance.now();state.textContent='粒子倒数 · 5'}function advance(){const next=Number(state.textContent.split('·')[1]||5)-1;if(next>0){particles=makeCount(next);phaseT=performance.now();state.textContent='粒子倒数 · '+next}else{phase='burst';phaseT=performance.now();state.textContent='粒子爆散'}}cake=BirthdayDesign.buildCake();title=BirthdayDesign.titlePoints();burst=[...cake,...title].map(p=>({x:p.x,y:p.y,z:p.z,size:p.size||.04,color:p.color||'#fff'}));function render(t){clear();if(phase==='count'){const u=Math.min(1,(t-phaseT)/700);particles.forEach(p=>dot({x:lerp(p.sx,p.tx,u),y:lerp(p.sy,p.ty,u),z:lerp(p.z,p.tz,u),size:p.size,color:p.color}));if(t-phaseT>1180)advance()}else if(phase==='burst'){const u=Math.min(1,(t-phaseT)/850);burst.forEach((p,i)=>{const a=i*.73,r=2+u*4.5+(i%7)*.06;dot({x:p.x*(1-u)+Math.cos(a)*r*u,y:p.y*(1-u)+Math.sin(a)*r*u,z:p.z*(1-u)+Math.sin(a*1.7)*r*u,size:p.size,color:p.color},1-u*.15)});if(t-phaseT>900){phase='cake';phaseT=t;BirthdayAudio.revealFromBeginning();state.textContent='生日蛋糕 · 音乐播放'}}else if(phase==='cake'){const u=Math.min(1,(t-phaseT)/1700);cake.forEach((p,i)=>{const a=i*.37,r=3.5*(1-u)+Math.sqrt(p.x*p.x+p.z*p.z)*u;dot({x:Math.cos(a)*r*(1-u)+p.x*u,y:Math.sin(a)*r*.6*(1-u)+p.y*u,z:Math.sin(a*1.7)*r*(1-u)+p.z*u,size:p.size,color:p.color},1)});title.forEach(p=>dot(p,.98));if(t-phaseT>1750)phase='cakeDone'}else if(phase==='cakeDone'){cake.forEach(p=>dot(p));title.forEach(p=>dot(p))}requestAnimationFrame(render)}requestAnimationFrame(render);begin.onclick=async()=>{if(phase!=='idle')return;try{await BirthdayAudio.arm()}catch(e){}start.classList.add('hide');beginCount()};again.onclick=()=>location.reload();c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(1.9,zoom*(e.deltaY>0?.91:1.1)));state.textContent='滚轮缩放 · '+Math.round(zoom*100)+'%'},{passive:false});c.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lx)*.004;rx+=(e.clientY-ly)*.004;rx=Math.max(-1.2,Math.min(1.2,rx));lx=e.clientX;ly=e.clientY});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false)})();</script></body></html>
