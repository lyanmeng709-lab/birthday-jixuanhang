<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>JIXUANHANG · Birthday Universe</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010106;color:#fff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 48%,#210b20,#08040e 48%,#010106);transition:opacity .8s}.start.off{opacity:0;pointer-events:none}.box{text-align:center}.ey{font-size:10px;letter-spacing:.4em;color:#ffb8df;margin-bottom:16px}.box h1{margin:0 0 10px;font-size:clamp(34px,6vw,72px);font-weight:200;letter-spacing:.12em;text-shadow:0 0 36px #ff65c5}.box p{margin:0 0 28px;color:#c9afc2;font-size:11px}.startbtn{border:1px solid #ffb0df88;border-radius:999px;padding:15px 42px;background:#ff4fae14;color:#fff;letter-spacing:.2em;font-size:13px;box-shadow:0 0 40px #ff4fae35,inset 0 0 20px #fff3;cursor:pointer}.hud{position:fixed;inset:0;pointer-events:none}.brand{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center;letter-spacing:.18em;text-shadow:0 0 24px #ff9bd7}.brand small{font-size:9px;color:#f6b9dc}.brand b{display:block;margin-top:5px;font-size:clamp(19px,3vw,38px);font-weight:300}.state{position:absolute;right:20px;top:20px;padding:8px 12px;border:1px solid #ffb7dd44;border-radius:99px;background:#100815aa;color:#f7cbe5;font-size:10px}.tools{position:absolute;left:18px;bottom:18px;display:flex;gap:7px;pointer-events:auto}.btn,label{border:1px solid #ffb7dd55;background:#100815cc;color:#ffeaf7;padding:9px 13px;border-radius:999px;font-size:10px;cursor:pointer}input{display:none}.hint{position:absolute;right:18px;bottom:18px;text-align:right;color:#c1aebc;font-size:10px;line-height:1.8}</style></head><body><canvas id="c"></canvas><div class="start" id="start"><div class="box"><div class="ey">JIXUANHANG · MEMORY UNIVERSE</div><h1>HAPPY BIRTHDAY</h1><p>点击按钮，开始一场由星尘组成的生日旅程</p><button class="startbtn" id="startBtn">点亮生日星云 ★</button></div></div><div class="hud"><div class="brand"><small>JIXUANHANG · MEMORY UNIVERSE</small><b>HAPPY BIRTHDAY</b></div><div class="state" id="state">等待点亮</div><div class="tools"><button class="btn" id="restart">重新开始</button><label>添加照片<input id="files" type="file" accept="image/*" multiple></label><button class="btn" id="hand">开启手势</button></div><div class="hint">🖐 张开手掌：粒子散开 · 照片出现<br>🤏 捏合：放大照片　·　✊ 握拳：回到蛋糕　·　拖动：旋转</div></div><video id="video" playsinline style="display:none"></video><script>(()=>{const C=document.getElementById('c'),X=C.getContext('2d');let W,H,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const TAU=Math.PI*2,R=(a,b)=>a+Math.random()*(b-a),L=(a,b,t)=>a+(b-a)*t,clamp=v=>Math.max(0,Math.min(1,v)),ease=t=>t*t*(3-2*t),smooth=t=>t*t*t*(t*(t*6-15)+10),COL=['#fff8fc','#ffd2e9','#ff9bd5','#e8caff','#bce7ff','#fff0c2'];let mode='idle',tm=0,phase=0,spread=0,rot=0,tilt=.03,tr=0,tt=.03,drag=false,lx=0,ly=0,focus=-1;const P=[],photos=[];function add(x,y,z,s,c,k='cake'){P.push({x,y,z,s,c,k,ph:R(0,TAU)})}function buildCake(){P.length=0;const tiers=[{r:1.72,y:-1.16,h:.64,n:2500},{r:1.32,y:-.48,h:.58,n:2150},{r:.96,y:.18,h:.52,n:1750}];tiers.forEach((q,k)=>{for(let i=0;i<q.n;i++){const a=R(0,TAU),rr=q.r*Math.sqrt(Math.random());add(Math.cos(a)*rr,q.y+R(-q.h/2,q.h/2),Math.sin(a)*rr,R(.10,.28),COL[(i+k)%COL.length])}for(let i=0;i<420;i++){const a=R(0,TAU),rr=q.r+R(-.025,.025);add(Math.cos(a)*rr,q.y+R(-q.h/2,q.h/2),Math.sin(a)*rr,R(.13,.31),i%3?'#ffd7eb':'#fff','rim')}});for(let i=0;i<520;i++){const a=R(0,TAU),rr=1.72+R(-.04,.04);add(Math.cos(a)*rr,-.78+Math.sin(a*10)*.04+R(-.04,.04),Math.sin(a)*rr,R(.10,.25),'#ffafd9','icing')}for(let i=0;i<7;i++){const a=i*TAU/7,rr=.67;for(let j=0;j<38;j++)add(Math.cos(a)*rr,-.02+j*.045,Math.sin(a)*rr,.17,'#eadfff','candle');for(let j=0;j<80;j++)add(Math.cos(a)*rr+R(-.04,.04),1.05+R(-.02,.28),Math.sin(a)*rr+R(-.04,.04),R(.13,.32),j%4?'#ffd36b':'#fff4c2','flame')}for(let i=0;i<280;i++){const a=i*TAU/280,rr=.76*(.58+.42*Math.abs(Math.cos(2.5*a)));add(Math.cos(a)*rr,1.5+Math.sin(a*2)*.08,Math.sin(a)*rr,R(.14,.32),'#fff0b6','star')}const tc=document.createElement('canvas');tc.width=1200;tc.height=180;const g=tc.getContext('2d');g.fillStyle='#fff';g.font='bold 66px Arial';g.textAlign='center';g.fillText('HAPPY BIRTHDAY JIXUANHANG',600,112);const d=g.getImageData(0,0,1200,180).data;for(let y=0;y<180;y+=5)for(let x=0;x<1200;x+=5)if(d[(y*1200+x)*4+3]>110)add((x-600)/175,(105-y)/175,-2.58,.36,'#fff7fc','text')}buildCake();function digit(n){const q=document.createElement('canvas');q.width=360;q.height=440;const g=q.getContext('2d');g.fillStyle='#fff';g.font='bold 370px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(n,180,222);const d=g.getImageData(0,0,360,440).data,a=[];for(let y=0;y<440;y+=4)for(let x=0;x<360;x+=4)if(d[(y*360+x)*4+3]>120)a.push({x:(x-180)/68,y:(220-y)/68});return a}let target=[];let DP=[];function seedCloud(n){const q=digit(n);DP=Array.from({length:Math.max(2300,q.length*2)},(_,i)=>{const b=q[i%q.length],a=R(0,TAU),rr=R(2.8,5.4);return{sx:Math.cos(a)*rr,sy:Math.sin(a)*rr*.72,sz:R(-.6,.6),cx:b.x+R(-.025,.025),cy:b.y+R(-.025,.025),cz:R(-.08,.08),ph:R(0,TAU),v:R(.65,1.15),seed:i}});target=q}function morphDigit(n){const q=digit(n),old=target.length?target:q;DP=Array.from({length:Math.max(2300,q.length*2)},(_,i)=>{const a=old[i%old.length],b=q[(i*7+Math.floor(i/37))%q.length];const midx=(a.x+b.x)*.5,midy=(a.y+b.y)*.5;return{sx:a.x,sy:a.y,sz:R(-.08,.08),cx:b.x+R(-.018,.018),cy:b.y+R(-.018,.018),cz:R(-.07,.07),mx:midx, my:midy, bend:R(-.38,.38),ph:R(0,TAU),v:R(.55,1.05),seed:i}});target=q}function project(a,b,z){const cy=Math.cos(rot),sy=Math.sin(rot),cx=Math.cos(tilt),sx=Math.sin(tilt),A=a*cy-z*sy,B=a*sy+z*cy,Y=b*cx-B*sx,Z=b*sx+B*cx,sc=H*.105,cam=10;return{x:W/2+A*sc/(1+Z/cam),y:H*.55-Y*sc/(1+Z/cam),z:Z}}function dot(a,b,s,o,c){X.save();X.globalAlpha=o;X.fillStyle=c;X.shadowColor=c;X.shadowBlur=Math.max(2,s*9);X.beginPath();X.arc(a,b,s,0,TAU);X.fill();X.restore()}function background(){const g=X.createRadialGradient(W*.5,H*.48,0,W*.5,H*.5,Math.max(W,H)*.78);g.addColorStop(0,'#18091c');g.addColorStop(.4,'#09040f');g.addColorStop(1,'#010106');X.fillStyle=g;X.fillRect(0,0,W,H);for(let i=0;i<260;i++){const a=(i*97.31)%W,b=(i*47.77)%H;dot(a,b,.38,.12+.13*Math.sin(tm+i),'#ffb8df')}}function drawDigits(){const e=smooth(clamp(phase));DP.forEach((p,i)=>{let a,b,z;if(p.mx!==undefined){const bend=Math.sin(e*Math.PI)*p.bend;a=L(p.sx,p.cx,e)+bend*Math.sin(e*Math.PI);b=L(p.sy,p.cy,e)-bend*Math.cos(e*Math.PI)*.45}else{a=L(p.sx,p.cx,e);b=L(p.sy,p.cy,e)}z=L(p.sz,p.cz,e)+Math.sin(tm*p.v+p.ph)*.055;const q=project(a,b,z),gl=.52+.28*Math.sin(tm*2.4+p.ph);dot(q.x,q.y,.115+(i%4)*.018,gl,COL[i%COL.length])});if(phase>.08&&phase<.92){const flow=1-Math.abs(phase-.5)*2;for(let k=0;k<95;k++){const u=k/94,ang=(u-.5)*1.3+Math.sin(tm*.9)*.03,yy=Math.sin(ang*3+tm*.7)*.34;const q=project(ang*4.4,yy+1.2,Math.sin(u*TAU+tm)*.35);dot(q.x,q.y,.06,.18*flow,'#ff8dcb')}}}function drawCake(){const arr=P.map(v=>{let a=v.x,b=v.y,z=v.z;if(spread){const e=smooth(spread);a=L(v.x,v.x*2.65+Math.cos(v.ph+tm*.45)*2.3,e);b=L(v.y,v.y*1.62+Math.sin(v.ph*1.3)*1.9,e);z=L(v.z,v.z*3+Math.sin(v.ph*1.7+tm*.3)*2.4,e)}return{v,q:project(a,b,z)}}).sort((a,b)=>b.q.z-a.q.z);arr.forEach(o=>{const v=o.v,q=o.q;let al=.64+.32*Math.sin(tm*1.8+v.ph);if(v.k==='text')al*=1.55;dot(q.x,q.y,Math.max(.09,v.s*(1-q.z*.015)),al,v.k==='text'?'#fff7fc':v.c)})}function drawPhotos(){if(mode!=='cloud'&&mode!=='focus')return;const e=smooth(clamp(phase));photos.forEach((p,i)=>{if(!p.img.complete)return;let a=L(p.x,p.tx,e),b=L(p.y,p.ty,e),z=L(p.z,p.tz,e),s=e;if(mode==='focus'&&i===focus){a=0;b=.3;z=5;s=1.65}const q=project(a,b,z),w=170*s*(H/900),h=122*s*(H/900);X.save();X.globalAlpha=Math.min(1,s);X.translate(q.x,q.y);X.rotate(p.a);X.shadowColor='#ff9bd7';X.shadowBlur=mode==='focus'&&i===focus?55:24;X.fillStyle='#fff';X.fillRect(-w/2-5,-h/2-5,w+10,h+10);X.shadowBlur=0;X.drawImage(p.img,-w/2,-h/2,w,h);X.restore()})}function wait(ms){return new Promise(r=>setTimeout(r,ms))}async function countdown(){mode='countdown';document.getElementById('state').textContent='粒子倒数';seedCloud(5);phase=0;for(let k=0;k<90;k++){phase=k/89;await wait(14)}await wait(450);for(let n=4;n>=1;n--){morphDigit(n);phase=0;for(let k=0;k<115;k++){phase=k/114;await wait(13)}await wait(330)}mode='burst';document.getElementById('state').textContent='粒子爆散';const start=performance.now();while(performance.now()-start<900){phase=(performance.now()-start)/900;await wait(16)}mode='cake';spread=0;phase=0;document.getElementById('state').textContent='生日星云 · 蛋糕形成';for(let k=0;k<85;k++){phase=k/84;await wait(16)}phase=0;photos.forEach(p=>p.s=0)}function openCloud(){if(mode!=='cake')return;mode='cloud';phase=0;spread=0;document.getElementById('state').textContent='粒子散开 · 照片出现';const st=performance.now();function f(){phase=clamp((performance.now()-st)/2100);spread=phase;if(phase<1&&mode==='cloud')requestAnimationFrame(f)}requestAnimationFrame(f)}function backCake(){mode='cake';spread=0;phase=0;focus=-1;document.getElementById('state').textContent='生日星云 · 合拢态'}function focusPhoto(i){focus=i;mode='focus';document.getElementById('state').textContent='照片 · 放大记忆'}function loop(){tm+=.016;background();if(mode==='countdown')drawDigits();else if(mode==='cake'||mode==='cloud'||mode==='focus'){drawCake();drawPhotos()}else if(mode==='burst'){for(let i=0;i<1100;i++){const a=i*TAU/1100+tm*.42,rr=1+((i*17)%100)/100*6;const q=project(Math.cos(a)*rr,Math.sin(a)*rr*.72,Math.sin(a*2+tm)*1.8);dot(q.x,q.y,.11+.04*(i%4),.6,'#ff9bd4')}}rot=L(rot,tr,.05);tilt=L(tilt,tt,.05);requestAnimationFrame(loop)}loop();const base=['IMG_1313.webp','IMG_1504.webp','IMG_1757.webp','IMG_2147.webp','IMG_2244.webp','IMG_2350.webp','IMG_2423.webp','IMG_2592.webp','IMG_2700.webp'];function addPhoto(src){const im=new Image();im.src=src;photos.push({img:im,x:R(-6,6),y:R(-2.7,3.7),z:R(-1,5),tx:R(-6,6),ty:R(-2.7,3.7),tz:R(-1,5),a:R(-.2,.2),s:0})}base.forEach(f=>addPhoto('assets/'+f));document.getElementById('files').onchange=e=>{[...e.target.files].forEach(f=>addPhoto(URL.createObjectURL(f)));e.target.value=''};document.getElementById('startBtn').onclick=async()=>{document.getElementById('start').classList.add('off');await wait(700);countdown()};document.getElementById('restart').onclick=()=>{document.getElementById('start').classList.remove('off');mode='idle';document.getElementById('state').textContent='等待点亮'};C.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};onpointerup=()=>drag=false;onpointermove=e=>{if(!drag||mode==='countdown'||mode==='burst')return;tr+=(e.clientX-lx)*.006;tt+=(e.clientY-ly)*.003;lx=e.clientX;ly=e.clientY};C.onclick=e=>{if(mode!=='cloud')return;let best=1,bi=-1;photos.forEach((p,i)=>{const q=project(p.x,p.y,p.z),d=Math.hypot(q.x-e.clientX,q.y-e.clientY)/Math.min(W,H);if(d<best){best=d;bi=i}});if(bi>=0)focusPhoto(bi)};async function load(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}document.getElementById('hand').onclick=async()=>{try{if(!window.Hands){try{await load('https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js');await load('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js')}catch(e){await load('https://unpkg.com/@mediapipe/hands/hands.js');await load('https://unpkg.com/@mediapipe/camera_utils/camera_utils.js')}}const v=document.getElementById('video');v.srcObject=await navigator.mediaDevices.getUserMedia({video:true});await v.play();const h=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});h.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.55,minTrackingConfidence:.55});h.onResults(o=>{const l=o.multiHandLandmarks&&o.multiHandLandmarks[0];if(!l||mode==='countdown'||mode==='burst'||mode==='idle')return;const tips=[8,12,16,20],pips=[6,10,14,18],w=l[0],ext=tips.filter((q,i)=>Math.hypot(l[q].x-w.x,l[q].y-w.y)>Math.hypot(l[pips[i]].x-w.x,l[pips[i]].y-w.y)*1.08).length,pinch=Math.hypot(l[4].x-l[8].x,l[4].y-l[8].y)<.065;if(pinch&&mode==='cloud'&&photos.length)focusPhoto(Math.floor(Math.random()*photos.length));else if(ext>=4&&mode==='cake')openCloud();else if(ext<=1&&(mode==='cloud'||mode==='focus'))backCake();else if(mode==='cloud')tr+=(l[9].x-.5)*.003});async function send(){if(v.readyState>=2)await h.send({image:v});requestAnimationFrame(send)}send();document.getElementById('hand').textContent='手势已开启'}catch(e){alert('摄像头或手势模型加载失败；鼠标仍可操作')}}})();</script></body></html>
