<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JIXUANHANG · Birthday Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020106;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle,#2d0c26,#09030e 58%,#020106);transition:opacity .6s}.start.hide{opacity:0;pointer-events:none}.box{text-align:center}.ey{font-size:10px;letter-spacing:.4em;color:#ffc3e5}.box h1{font-weight:200;letter-spacing:.12em;font-size:clamp(36px,7vw,76px);margin:15px 0 10px;text-shadow:0 0 35px #ff62bb}.box p{font-size:12px;color:#cbb5c5;margin-bottom:28px}.box button,.bottom button{border:1px solid #ffacd888;background:#ff59b516;color:#fff;border-radius:30px;padding:12px 22px;letter-spacing:.12em;cursor:pointer}.ui{position:fixed;z-index:2;inset:0;pointer-events:none}.title{position:absolute;top:16px;left:50%;transform:translateX(-50%);text-align:center;letter-spacing:.14em;text-shadow:0 0 22px #ff86c8}.title small{font-size:9px}.title b{display:block;font-weight:300;font-size:25px;margin-top:5px}.state{position:absolute;right:16px;top:16px;font-size:10px;padding:7px 11px;border:1px solid #ffb3db44;border-radius:20px;background:#120814aa}.bottom{position:absolute;left:16px;bottom:16px;pointer-events:auto}.bottom button{padding:8px 12px;font-size:10px}.zoom{position:absolute;right:16px;bottom:16px;font-size:10px;color:#cdb9c7}.zoom b{color:#ffe1f0}</style></head><body><canvas id="scene"></canvas><div class="start" id="start"><div class="box"><div class="ey">JIXUANHANG · MEMORY UNIVERSE</div><h1>HAPPY BIRTHDAY</h1><p>测试版 · 鼠标滑轮控制远近</p><button id="begin">点亮生日星云 ★</button></div></div><div class="ui"><div class="title"><small>JIXUANHANG · MEMORY UNIVERSE</small><b>HAPPY BIRTHDAY</b></div><div class="state" id="state">测试版 · 等待点亮</div><div class="bottom"><button id="again">重新开始</button></div><div class="zoom">滚轮：<b>拉近 / 拉远</b>　拖动：<b>旋转</b></div></div><audio id="birthdayAudio" preload="auto" src="audio/birthday.mp3"></audio><script src="countdown.js"></script><script src="birthday.js"></script><script>(()=>{const c=document.getElementById('scene'),ctx=c.getContext('2d');let w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio||1,1.5),zoom=1,rx=0,ry=0,drag=false,lx=0,ly=0;function size(){w=innerWidth;h=innerHeight;d=Math.min(devicePixelRatio||1,1.5);c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function wheel(e){e.preventDefault();zoom=Math.max(.55,Math.min(1.9,zoom*(e.deltaY>0?.91:1.1)));document.getElementById('state').textContent='测试版 · 缩放 '+Math.round(zoom*100)+'%'}c.addEventListener('wheel',wheel,{passive:false});c.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lx)*.004;rx+=(e.clientY-ly)*.004;lx=e.clientX;ly=e.clientY});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);const start=document.getElementById('start'),begin=document.getElementById('begin'),again=document.getElementById('again');begin.onclick=()=>{start.classList.add('hide');document.getElementById('state').textContent='测试版 · 已启动'};again.onclick=()=>location.reload();})();</script></body></html>
