<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JIXUANHANG · Birthday Universe</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020106;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle,#2d0c26,#09030e 58%,#020106);transition:opacity .7s}.hide{opacity:0;pointer-events:none}.box{text-align:center}.ey{font-size:10px;letter-spacing:.4em;color:#ffc3e5}.box h1{font-weight:200;letter-spacing:.12em;font-size:clamp(36px,7vw,76px);margin:15px 0 10px;text-shadow:0 0 35px #ff62bb}.box p{font-size:12px;color:#cbb5c5;margin-bottom:28px}.box button,.ui button{border:1px solid #ffacd888;background:#ff59b516;color:#fff;border-radius:30px;padding:12px 22px;letter-spacing:.12em;cursor:pointer}.ui{position:fixed;z-index:2;inset:0;pointer-events:none}.title{position:absolute;top:16px;left:50%;transform:translateX(-50%);text-align:center;letter-spacing:.14em;text-shadow:0 0 22px #ff86c8}.title small{font-size:9px}.title b{display:block;font-weight:300;font-size:25px;margin-top:5px}.state{position:absolute;right:16px;top:16px;font-size:10px;padding:7px 11px;border:1px solid #ffb3db44;border-radius:20px;background:#120814aa}.bottom{position:absolute;left:16px;bottom:16px;pointer-events:auto}.bottom button{padding:8px 12px;font-size:10px}</style></head><body><canvas id="c"></canvas><div class="start" id="start"><div class="box"><div class="ey">JIXUANHANG · MEMORY UNIVERSE</div><h1>HAPPY BIRTHDAY</h1><p>点击按钮，开始一场由星尘组成的生日旅程</p><button id="go">点亮生日星云 ★</button></div></div><div class="ui"><div class="title"><small>JIXUANHANG · MEMORY UNIVERSE</small><b>HAPPY BIRTHDAY</b></div><div class="state" id="state">等待点亮</div><div class="bottom"><button id="reset">重新开始</button></div></div><audio id="music" preload="auto" src="audio/birthday.mp3"></audio><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false}),audio=document.querySelector('#music'),start=document.querySelector('#start'),state=document.querySelector('#state');let W,H,D,mode='idle',t=0,prog=0,rot=0,targetRot=0,started=false;const TAU=Math.PI*2,colors=['#fff8fc','#ffd0e8','#ff98d3','#e8caff','#ffe9ad','#fff1c8'];function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize,{passive:true});resize();const stars=Array.from({length:180},(_,i)=>({x:(i*73)%1000/1000,y:(i*137)%1000/1000,a:.06+Math.random()*.15}));function bg(){const q=g.createRadialGradient(W/2,H*.48,0,W/2,H*.5,Math.max(W,H)*.82);q.addColorStop(0,'#19091e');q.addColorStop(.46,'#09040f');q.addColorStop(1,'#010105');g.fillStyle=q;g.fillRect(0,0,W,H);stars.forEach((p,i)=>{g.globalAlpha=p.a+.035*Math.sin(t*1.7+i);g.fillStyle='#ffb9dd';g.fillRect(p.x*W,p.y*H,1,1)});g.globalAlpha=1}function glow(x,y,r,col,a=1){const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,'#fff');q.addColorStop(.18,col);q.addColorStop(1,'transparent');g.globalAlpha=a;g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.globalAlpha=1}function pos(x,y,z){const co=Math.cos(rot),si=Math.sin(rot),X=x*co-z*si,Z=x*si+z*co,s=H*.105,k=10;return[W/2+X*s/(1+Z/k),H*.55-y*s/(1+Z/k)]}function numberPoints(n){const q=document.createElement('canvas');q.width=320;q.height=440;const z=q.getContext('2d');z.fillStyle='#fff';z.font='bold 365px Arial';z.textAlign='center';z.textBaseline='middle';z.fillText(n,160,222);const d=z.getImageData(0,0,320,440).data,a=[];for(let y=0;y<440;y+=3)for(let x=0;x<320;x+=3)if(d[(y*320+x)*4+3]>100)a.push([(x-160)/70,(220-y)/70]);return a}let pts=[];function seed(n){const target=numberPoints(n);pts=Array.from({length:3400},(_,i)=>{const q=target[(i*17+Math.floor(i/53))%target.length],a=Math.random()*TAU,r=3.1+Math.random()*3.3;return{x:Math.cos(a)*r,y:Math.sin(a)*r*.72,z:(Math.random()-.5)*.7,tx:q[0]+(Math.random()-.5)*.025,ty:q[1]+(Math.random()-.5)*.025,tz:(Math.random()-.5)*.14,p:Math.random()*TAU}})}function drawNums(){const e=prog*prog*(3-2*prog);pts.forEach((p,i)=>{const q=pos(p.x+(p.tx-p.x)*e,p.y+(p.ty-p.y)*e,p.z+(p.tz-p.z)*e);glow(q[0],q[1],1.7,colors[i%colors.length],.58+.12*Math.sin(p.p+t*2))})}function drawBurst(){for(let i=0;i<1800;i++){const a=i*TAU/1800+t*.7,r=1.15+(i%160)/160*6.7,q=pos(Math.cos(a)*r,Math.sin(a)*r*.72,Math.sin(a*2+t)*1.7);glow(q[0],q[1],1.5,i%4?'#ff9bd4':'#ffe9ad',.42)}}const cake=[];function buildCake(){cake.length=0;const tiers=[{r:1.82,y:-1.12,h:.72,n:3400},{r:1.42,y:-.42,h:.64,n:2900},{r:1.04,y:.27,h:.56,n:2400}];tiers.forEach((q,k)=>{for(let i=0;i<q.n;i++){const a=Math.random()*TAU,rr=q.r*Math.sqrt(Math.random()),y=q.y+(Math.random()-.5)*q.h;cake.push({x:Math.cos(a)*rr,y,z:Math.sin(a)*rr,col:k===0?(i%5?'#fff1f5':'#ffd0e5'):k===1?(i%6?'#fff8fb':'#ffc5df'):(i%5?'#fff7fb':'#ffe0ec'),r:.42+Math.random()*.55})}for(let i=0;i<420;i++){const a=i*TAU/420;cake.push({x:Math.cos(a)*(q.r+.015),y:q.y+q.h*.47+Math.sin(a*7)*.035,z:Math.sin(a)*(q.r+.015),col:'#fff8fc',r:.58})}});for(let i=0;i<480;i++){const a=i*TAU/480,rr=1.83+Math.sin(i*9)*.025;cake.push({x:Math.cos(a)*rr,y:-.78+Math.sin(a*10)*.035,z:Math.sin(a)*rr,col:i%3?'#6b2a2e':'#9a3b43',r:.5})}for(let i=0;i<7;i++){const a=i*TAU/7;for(let j=0;j<120;j++){const y=.86+j*.006;cake.push({x:Math.cos(a)*.62+(Math.random()-.5)*.025,y,z:Math.sin(a)*.62+(Math.random()-.5)*.025,col:j<90?'#f5c9dc':'#ffd66f',r:.42})}for(let j=0;j<70;j++){const y=1.43+j*.008;cake.push({x:Math.cos(a)*.62+(Math.random()-.5)*.07,y,z:Math.sin(a)*.62+(Math.random()-.5)*.07,col:'#ffd66b',r:.7})}}}buildCake();const tc=document.createElement('canvas');tc.width=1100;tc.height=150;const tg=tc.getContext('2d');tg.fillStyle='#fff';tg.font='bold 58px Arial';tg.textAlign='center';tg.textBaseline='middle';tg.fillText('HAPPY BIRTHDAY JIXUANHANG',550,75);const text=[];const td=tg.getImageData(0,0,1100,150).data;for(let y=0;y<150;y+=4)for(let x=0;x<1100;x+=4)if(td[(y*1100+x)*4+3]>100)text.push({x:(x-550)/155,y:(75-y)/48,z:-2.42+(Math.random()-.5)*.07});function drawCake(){const e=prog*prog*(3-2*prog);cake.forEach((p,i)=>{const q=pos(p.x*e,p.y*e,p.z*e);glow(q[0],q[1],p.r,p.col,.42+.18*Math.sin(t*1.5+i*.017))});text.forEach(p=>{const q=pos(p.x*e,p.y*e,p.z*e);glow(q[0],q[1],2.0,'#ffe7a8',.98)})}function loop(){t+=.016;bg();rot+=(targetRot-rot)*.055;if(mode==='count')drawNums();else if(mode==='burst')drawBurst();else if(mode==='cake')drawCake();requestAnimationFrame(loop)}loop();const frame=ms=>new Promise(resolve=>{const s=performance.now();function f(n){if(n-s>=ms)resolve();else requestAnimationFrame(f)}requestAnimationFrame(f)});async function showDigit(n){seed(n);prog=0;const s=performance.now();while(performance.now()-s<760){prog=Math.min(1,(performance.now()-s)/560);await new Promise(requestAnimationFrame)}prog=1;await frame(180);const o=performance.now();while(performance.now()-o<180){prog=1-(performance.now()-o)/180;await new Promise(requestAnimationFrame)}}async function begin(){if(started)return;started=true;start.classList.add('hide');state.textContent='粒子倒数';audio.currentTime=0;audio.muted=true;audio.volume=1;try{await audio.play()}catch(e){}mode='count';for(let n=5;n>=1;n--)await showDigit(n);mode='burst';state.textContent='粒子爆散';await frame(850);mode='cake';state.textContent='生日星云 · 蛋糕形成';prog=0;const s=performance.now();while(performance.now()-s<1900){prog=Math.min(1,(performance.now()-s)/1700);await new Promise(requestAnimationFrame)}prog=1;audio.currentTime=0;audio.muted=false;state.textContent='生日星云 · 音乐播放'}document.querySelector('#go').onclick=begin;document.querySelector('#reset').onclick=()=>location.reload();c.addEventListener('pointermove',e=>{if(e.buttons)targetRot+=(e.movementX||0)*.0035});})();</script></body></html>
