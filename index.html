let state='cake',selected=null,lastHand={x:.5,y:.5};const labels={cake:'蛋糕展示态 · 握拳回到这里',cloud:'照片云散开态 · 张开五指',focus:'照片放大态 · 松开捏合返回'};function anim(o,t){gsap.to(o.position,{x:t.x,y:t.y,z:t.z,duration:.9,ease:'power3.inOut'});gsap.to(o.rotation,{x:t.rx,y:t.ry,z:t.rz,duration:.9,ease:'power3.inOut'});gsap.to(o.scale,{x:t.s,y:t.s,z:t.s,duration:.9,ease:'back.out(1.2)'})}function setState(n,pick=null){state=n;if(pick!==null)selected=pick;statePill.textContent=labels[state];if(n==='cake'){selected=null;photos.forEach(p=>anim(p,p.userData.cake));bokeh.materialBokeh.aperture=.00004}else if(n==='cloud'){selected=null;photos.forEach(p=>anim(p,p.userData.cloud));bokeh.materialBokeh.aperture=.000035}else{if(selected===null)selected=pick??0;photos.forEach((p,i)=>{if(i===selected)gsap.to(p.position,{x:0,y:1.1,z:6.1,duration:.9});else anim(p,p.userData.cloud);gsap.to(p.scale,{x:i===selected?1.65:.72,y:i===selected?1.65:.72,z:i===selected?1.65:.72,duration:.9})});bokeh.materialBokeh.focus=6.1;bokeh.materialBokeh.aperture=.00042}}setState('cake');
