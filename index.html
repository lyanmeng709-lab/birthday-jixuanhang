<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>JIXUANHANG · Birthday Star Cloud</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050d;color:#fff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:24px;left:50%;transform:translateX(-50%);text-align:center;letter-spacing:.22em;text-shadow:0 0 24px #bdeaff}.top small{font-size:10px;color:#9edfff}.top h1{margin:8px 0 0;font-weight:400;font-size:clamp(22px,3.8vw,48px)}.state{position:absolute;top:24px;right:24px;padding:9px 14px;border:1px solid #8bdcff55;border-radius:99px;background:#081224aa;backdrop-filter:blur(12px);font-size:11px;color:#c8edff}.bottom{position:absolute;left:22px;bottom:20px;pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap}.btn,label{padding:10px 15px;border:1px solid #9bdfff55;border-radius:99px;background:#081224cc;color:#e9f8ff;font-size:11px;cursor:pointer;box-shadow:0 0 20px #66caff12}input{display:none}.hint{position:absolute;right:22px;bottom:20px;text-align:right;font-size:10px;line-height:1.8;color:#a8cde3}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#02040b;z-index:20;transition:.8s}.loading.hide{opacity:0;pointer-events:none}.orb{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#fff,#bceaff 8%,#8a8cff 25%,transparent 65%);filter:blur(2px);box-shadow:0 0 90px #7ccfff}.loading p{text-align:center;font-size:12px;color:#b9dced}.cam{display:none}</style></head><body><canvas id="c"></canvas><div id="ui"><div class="top"><small>JIXUANHANG · MEMORY UNIVERSE</small><h1>HAPPY BIRTHDAY</h1></div><div class="state" id="state">生日星云 · 合拢态</div><div class="bottom"><button class="btn" id="reset">回到蛋糕</button><button class="btn" id="open">散开照片</button><label>添加照片<input id="files" type="file" accept="image/*" multiple></label><button class="btn" id="hand">开启手势</button></div><div class="hint">五指张开：星云散开　·　握拳：蛋糕聚合<br>拖动：旋转空间　·　点击照片：放大</div></div><video id="video" class="cam" playsinline></video><div class="loading" id="load"><div><div class="orb"></div><p>正在点亮生日星云…</p></div></div><script>(()=>{const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t;let mode='cake',rotY=0,rotX=.05,targetRotY=0,targetRotX=.05,focus=-1,drag=false,lx=0,ly=0,time=0;const photos=[],particles=[],colors=['#dff8ff','#a9dcff','#d8c8ff','#ffd1ec','#ffffff','#9de8ff'];function P(x,y,z,size,col,kind){particles.push({x,y,z,s:size,c:col,k:kind||'dust',ph:rnd(0,TAU),sx:x,sy:y,sz:z})}function makeCake(){particles.length=0;for(let tier=0;tier<4;tier++){const r=1.25+tier*.52,y0=-1.45+tier*.82,h=.72;for(let i=0;i<520;i++){let a=rnd(0,TAU),rr=r*Math.sqrt(Math.random()),y=y0+rnd(-h/2,h/2);P(Math.cos(a)*rr,y,Math.sin(a)*rr,rnd(.7,2.2),colors[i%colors.length],'cake')}for(let i=0;i<360;i++){let a=rnd(0,TAU),rr=r+rnd(-.08,.08),y=y0+rnd(-h/2,h/2);P(Math.cos(a)*rr,y,Math.sin(a)*rr,rnd(1,2.8),i%3?'#b9eaff':'#fff','rim')}}for(let i=0;i<240;i++){let a=rnd(0,TAU),r=2.8,y=1+Math.sin(a*7)*.1+rnd(-.18,.18);P(Math.cos(a)*r,y,Math.sin(a)*r,rnd(1,2.5),'#ffd9ee','icing')}for(let i=0;i<7;i++){let a=TAU*i/7,r=.78;for(let j=0;j<35;j++)P(Math.cos(a)*r,-.2+j*.055,Math.sin(a)*r,1.3,'#f4e8ff','candle');for(let j=0;j<65;j++)P(Math.cos(a)*r+rnd(-.07,.07),1.85+rnd(-.05,.35),Math.sin(a)*r+rnd(-.07,.07),rnd(1,3),j%3?'#ffd36b':'#fff6c4','flame')}for(let i=0;i<180;i++){let a=TAU*i/180,r=1.15*(.55+.45*Math.abs(Math.cos(2.5*a)));P(Math.cos(a)*r,2.25+Math.sin(a*2)*.12,Math.sin(a)*r,rnd(1,3),'#fff3bd','star')}const text=document.createElement('canvas');text.width=1100;text.height=180;const t=text.getContext('2d');t.fillStyle='#fff';t.font='bold 72px Arial';t.textAlign='center';t.fillText('HAPPY BIRTHDAY JIXUANHANG',550,105);const dat=t.getImageData(0,0,text.width,text.height).data;for(let y=0;y<180;y+=4)for(let x=0;x<1100;x+=4)if(dat[(y*1100+x)*4+3]>120)P((x-550)/160,(95-y)/160,-2.65,1.6,'#ffd9ff','text')}makeCake();const files=['IMG_1313.webp','IMG_1504.webp','IMG_1757.webp','IMG_2147.webp','IMG_2244.webp','IMG_2350.webp','IMG_2423.webp','IMG_2592.webp','IMG_2700.webp'];function addPhoto(src){const img=new Image();img.src=src;const p={img,x:rnd(-6,6),y:rnd(-2.5,3.8),z:rnd(-1,5),s:1,ts:1,ang:rnd(-.18,.18),ta:0,loaded:false};img.onload=()=>p.loaded=true;photos.push(p)}files.forEach(f=>addPhoto('assets/'+f));function project(x,y,z){const cy=Math.cos(rotY),sy=Math.sin(rotY),cx=Math.cos(rotX),sx=Math.sin(rotX);let X=x*cy-z*sy,Z=x*sy+z*cy,Y=y*cx-Z*sx;Z=y*sx+Z*cx;const cam=10,scale=H*.105;return{x:W/2+X*scale/(1+Z/cam),y:H*.56-Y*scale/(1+Z/cam),z:Z}}function star(x,y,r,a,c){ctx.save();ctx.globalAlpha=a;ctx.shadowBlur=r*5;ctx.shadowColor=c;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore()}function drawBg(){let g=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.7);g.addColorStop(0,'#111b3c');g.addColorStop(.45,'#080d21');g.addColorStop(1,'#02040b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}function drawCakeParticles(){const arr=particles.map(p=>{let ox=p.x,oy=p.y,oz=p.z;if(mode==='cloud'){let t=1-Math.exp(-.025*(time+1));ox=lerp(ox,ox*2.6+Math.sin(p.ph+time*.4)*2.2,t);oy=lerp(oy,oy*1.5+Math.cos(p.ph)*1.8,t);oz=lerp(oz,oz*2.8+Math.sin(p.ph*1.7)*2,t)}else{let t=1-Math.exp(-.035*(time+1));ox=lerp(ox,p.sx,t);oy=lerp(oy,p.sy,t);oz=lerp(oz,p.sz,t)}let q=project(ox,oy,oz);return{...p,q}}).sort((a,b)=>b.q.z-a.q.z);for(const p of arr){let a=.55+.35*Math.sin(time*2+p.ph);star(p.q.x,p.q.y,Math.max(.45,p.s*(1.2-p.q.z*.025)),a,p.c)}}function drawPhotos(){photos.forEach((p,i)=>{let tx,ty,tz,ts;if(mode==='cake'){tx=(i-4)*.7;ty=-1.8+(i%3)*.35;tz=2.2;ts=.18}else if(mode==='focus'&&i===focus){tx=0;ty=.5;tz=5;ts=1.65}else{tx=p.x;ty=p.y;tz=p.z;ts=1}p.x=lerp(p.x,tx,.045);p.y=lerp(p.y,ty,.045);p.z=lerp(p.z,tz,.045);p.s=lerp(p.s,ts,.06);p.ang=lerp(p.ang,mode==='focus'&&i===focus?0:p.ta,.05);if(!p.loaded)return;let q=project(p.x,p.y,p.z),w=160*p.s*(H/900),h=118*p.s*(H/900);ctx.save();ctx.translate(q.x,q.y);ctx.rotate(p.ang);ctx.shadowBlur=mode==='focus'&&i===focus?45:18;ctx.shadowColor='#a8dcff';ctx.fillStyle='#f7f4f0';ctx.fillRect(-w/2-5,-h/2-5,w+10,h+10);ctx.shadowBlur=0;ctx.drawImage(p.img,-w/2,-h/2,w,h);ctx.restore()})}function animate(){time+=.016;drawBg();rotY=lerp(rotY,targetRotY,.04);rotX=lerp(rotX,targetRotX,.04);drawCakeParticles();drawPhotos();requestAnimationFrame(animate)}animate();setTimeout(()=>document.getElementById('load').classList.add('hide'),900);function setMode(m,i=-1){mode=m;focus=i;document.getElementById('state').textContent=m==='cake'?'生日星云 · 合拢态':m==='cloud'?'照片星云 · 散开态':'照片聚焦 · 记忆'}document.getElementById('reset').onclick=()=>setMode('cake');document.getElementById('open').onclick=()=>setMode('cloud');document.getElementById('files').onchange=e=>{[...e.target.files].forEach(f=>addPhoto(URL.createObjectURL(f)));setMode('cloud');e.target.value=''};cv.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};onpointerup=()=>drag=false;onpointermove=e=>{if(drag){targetRotY+=(e.clientX-lx)*.006;targetRotX+=(e.clientY-ly)*.003;lx=e.clientX;ly=e.clientY}};cv.onclick=e=>{if(mode!=='cloud')return;let best=1,bi=-1;photos.forEach((p,i)=>{let q=project(p.x,p.y,p.z),d=Math.hypot(q.x-e.clientX,q.y-e.clientY)/Math.min(W,H);if(d<best){best=d;bi=i}});if(bi>=0)setMode('focus',bi)};document.getElementById('hand').onclick=async()=>{try{if(!window.Hands){await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js');await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js')}if(!window.Hands||!window.Camera)throw Error();const video=document.getElementById('video'),stream=await navigator.mediaDevices.getUserMedia({video:true});video.srcObject=stream;await video.play();const hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.55,minTrackingConfidence:.55});hands.onResults(r=>{const l=r.multiHandLandmarks&&r.multiHandLandmarks[0];if(!l)return;const tips=[8,12,16,20],pips=[6,10,14,18],w=l[0],ext=tips.filter((t,i)=>Math.hypot(l[t].x-w.x,l[t].y-w.y)>Math.hypot(l[pips[i]].x-w.x,l[pips[i]].y-w.y)*1.1).length;const d=Math.hypot(l[4].x-l[8].x,l[4].y-l[8].y);if(d<.06&&mode==='cloud')setMode('focus',Math.floor(Math.random()*photos.length));else if(ext>=4)setMode('cloud');else if(ext<=1)setMode('cake');else if(mode==='cloud')targetRotY+=(l[9].x-.5)*.003});const cam=new Camera(video,{onFrame:async()=>hands.send({image:video}),width:640,height:480});cam.start();document.getElementById('hand').textContent='手势已开启'}catch(e){alert('手势需要浏览器允许摄像头；鼠标和照片功能仍可用')}};function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}})();</script></body></html>
