<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JIXUANHANG · Happy Birthday</title>
<style>
:root{--cream:#fff8ec;--pink:#ff82ab;--rose:#ff4f86;--brown:#3b211d;--gold:#ffd36b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#140a10;color:var(--cream);font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:24px;top:22px;z-index:5;pointer-events:none}.brand{font-size:11px;letter-spacing:.28em;color:#ffe8bd;text-shadow:0 0 18px #ffb34d}h1{margin:7px 0 3px;font-size:clamp(22px,3vw,38px);font-weight:850}.sub{font-size:12px;color:#ffdbe7;opacity:.9}
#statePill{position:fixed;right:22px;top:20px;z-index:5;padding:10px 14px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(50,20,29,.45);backdrop-filter:blur(12px);font-size:12px}#hint{position:fixed;right:22px;bottom:22px;z-index:5;max-width:380px;text-align:right;font-size:11px;line-height:1.65;color:#ffe8e1;opacity:.86}
#controls{position:fixed;left:22px;bottom:22px;z-index:6;display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,label.file{border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:10px 14px;color:#fff7ef;background:rgba(54,25,34,.52);backdrop-filter:blur(12px);cursor:pointer;font:inherit;font-size:12px}button:hover,label.file:hover{background:rgba(255,126,170,.22)}input[type=file]{display:none}
#camera{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}#gestureDot{position:fixed;z-index:7;width:14px;height:14px;border-radius:50%;margin:-7px 0 0 -7px;border:2px solid #fff;background:#ff72a6;box-shadow:0 0 22px #ff9cbb;display:none;pointer-events:none}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle,#61283b,#160b10 68%);transition:opacity .55s,visibility .55s}.loader{text-align:center}.loader .cake{font-size:62px;filter:drop-shadow(0 0 22px #ffc65b)}.loader p{margin:10px 0;color:#ffe6d7;font-size:13px;letter-spacing:.08em}.scan{width:190px;height:3px;margin:18px auto 0;background:rgba(255,255,255,.15);overflow:hidden;border-radius:4px}.scan i{display:block;width:45%;height:100%;background:#ffd36e;animation:scan 1.2s infinite}@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(450%)}}
#loading.hide{opacity:0;visibility:hidden;pointer-events:none}
@media(max-width:700px){#hud{left:15px;top:14px}.brand{font-size:9px}#statePill{right:14px;top:14px}#hint{display:none}#controls{left:14px;bottom:14px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"><div class="brand">JIXUANHANG · BIRTHDAY MEMORY</div><h1>Happy Birthday ✦</h1><div class="sub">让照片、烛光和回忆一起漂浮起来</div></div>
<div id="statePill">蛋糕展示态 · 握拳回到这里</div><div id="gestureDot"></div>
<div id="hint">五指张开：散开照片云　·　移动手掌：环视场景<br>拇指＋食指捏合：抓取照片　·　松开：返回照片云</div>
<div id="controls"><button id="camBtn">开启手势控制</button><label class="file">添加照片<input id="upload" type="file" accept="image/*" multiple></label><button id="resetBtn">回到蛋糕</button></div>
<video id="camera" playsinline muted></video>
<div id="loading"><div class="loader"><div class="cake">🎂</div><p>正在点亮生日场景…</p><div class="scan"><i></i></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
<script>
(()=>{
'use strict';
const THREE=window.THREE,gsap=window.gsap;
const app=document.querySelector('#app'),loading=document.querySelector('#loading'),statePill=document.querySelector('#statePill'),dot=document.querySelector('#gestureDot'),video=document.querySelector('#camera');
if(!THREE||!gsap){document.querySelector('#loading .loader p').textContent='3D 引擎加载失败，请刷新页面';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x160b11);scene.fog=new THREE.FogExp2(0x160b11,.035);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,1.15,14);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;app.appendChild(renderer.domElement);
const world=new THREE.Group();scene.add(world);const cake=new THREE.Group(),photosGroup=new THREE.Group(),particlesGroup=new THREE.Group(),sparkGroup=new THREE.Group();world.add(cake,photosGroup,particlesGroup,sparkGroup);
const M={cream:new THREE.MeshPhysicalMaterial({color:0xfff7e8,roughness:.4,clearcoat:.35}),creamPink:new THREE.MeshPhysicalMaterial({color:0xffd8df,roughness:.4,clearcoat:.3}),pink:new THREE.MeshPhysicalMaterial({color:0xff78a7,roughness:.32,clearcoat:.38}),choc:new THREE.MeshPhysicalMaterial({color:0x3a1b16,roughness:.27,clearcoat:.32}),gold:new THREE.MeshPhysicalMaterial({color:0xffc84f,metalness:.72,roughness:.2,clearcoat:.5}),berry:new THREE.MeshPhysicalMaterial({color:0xff3f69,roughness:.28,clearcoat:.42}),leaf:new THREE.MeshStandardMaterial({color:0x5d9348,roughness:.6}),candle:new THREE.MeshPhysicalMaterial({color:0xffead1,roughness:.3,clearcoat:.3}),wick:new THREE.MeshBasicMaterial({color:0x392019})};
function add(g,m,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;cake.add(o);return o}
function tier(r,h,y,m){return add(new THREE.CylinderGeometry(r,r*.96,h,96),m,0,y,0)}
function torus(r,t,y,m){const o=add(new THREE.TorusGeometry(r,t,24,96),m,0,y,0);o.rotation.x=Math.PI/2;return o}
function blob(x,y,z,s,m=M.cream){const o=add(new THREE.SphereGeometry(1,24,16),m,x,y,z);o.scale.set(s*1.25,s*.62,s*.82);return o}
// 三层蛋糕轮廓：宽底、中层、窄顶层，整体严格参考用户手绘稿
 tier(3.35,1.25,.8,M.cream);tier(2.55,1.0,1.93,M.pink);tier(1.72,.92,2.82,M.cream);
 torus(3.34,.2,1.36,M.creamPink);torus(2.54,.18,2.43,M.cream);torus(1.72,.15,3.29,M.pink);
// 手绘稿的波浪奶油边
for(let i=0;i<22;i++){const a=i/22*Math.PI*2;blob(Math.cos(a)*3.17,1.34+Math.sin(i*1.7)*.055,Math.sin(a)*3.17,.25,M.creamPink)}
for(let i=0;i<16;i++){const a=i/16*Math.PI*2;blob(Math.cos(a)*2.37,2.39+Math.sin(i*1.9)*.045,Math.sin(a)*2.37,.21,M.cream)}
for(let i=0;i<12;i++){const a=i/12*Math.PI*2;blob(Math.cos(a)*1.58,3.26+Math.sin(i*2.1)*.04,Math.sin(a)*1.58,.17,M.creamPink)}
// 巧克力片
for(let i=0;i<11;i++){const a=i/11*Math.PI*2,r=1.43,o=add(new THREE.BoxGeometry(.14,.58,.08),M.choc,Math.cos(a)*r,3.25,Math.sin(a)*r);o.rotation.y=-a;o.rotation.z=(i%2?-1:1)*.22}
// 草莓
function strawberry(x,y,z,s=1){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.IcosahedronGeometry(.3*s,2),M.berry);b.scale.y=1.25;b.castShadow=true;g.add(b);const l=new THREE.Mesh(new THREE.ConeGeometry(.2*s,.24*s,6),M.leaf);l.position.y=.29*s;l.rotation.x=Math.PI;l.castShadow=true;g.add(l);g.position.set(x,y,z);cake.add(g)}
[[1.45,2.55,1.45],[-1.45,2.55,1.45],[1.65,3.45,.15],[-1.65,3.46,.2],[.65,3.62,.62],[-.65,3.62,.62]].forEach(p=>strawberry(...p,.9));
// 顶部奶油花
for(let i=0;i<7;i++){const a=i/7*Math.PI*2;blob(Math.cos(a)*.9,3.38,Math.sin(a)*.9,.25,M.creamPink)}
// 七支生日蜡烛
const candles=[];for(let i=0;i<7;i++){const a=i/7*Math.PI*2,r=.82;add(new THREE.CylinderGeometry(.085,.085,.82,24),M.candle,Math.cos(a)*r,4.02,Math.sin(a)*r);add(new THREE.CylinderGeometry(.018,.018,.13,10),M.wick,Math.cos(a)*r,4.5,Math.sin(a)*r);const f=add(new THREE.SphereGeometry(.13,18,12),new THREE.MeshBasicMaterial({color:0xffb22e,transparent:true,opacity:.95}),Math.cos(a)*r,4.68,Math.sin(a)*r);f.scale.set(.7,1.55,.7);f.userData.phase=Math.random()*6.28;candles.push(f)}
add(new THREE.CylinderGeometry(4.15,.2,.22,96),new THREE.MeshPhysicalMaterial({color:0xffd6df,roughness:.24,clearcoat:.48}),0,.08,0);
// 正面巧克力装饰牌：厚度+金色文字纹理
const sign=add(new THREE.BoxGeometry(6.0,.78,.24),M.choc,0,.74,3.34);sign.rotation.x=-.03;
const cv=document.createElement('canvas');cv.width=1200;cv.height=180;const cx=cv.getContext('2d');cx.font='900 58px Arial,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.shadowColor='rgba(255,214,116,.55)';cx.shadowBlur=14;cx.fillStyle='#ffd36b';cx.fillText('HAPPY BIRTHDAY JIXUANHANG',600,91);const signTex=new THREE.CanvasTexture(cv);signTex.colorSpace=THREE.SRGBColorSpace;const signFace=new THREE.Mesh(new THREE.PlaneGeometry(5.72,.69),new THREE.MeshBasicMaterial({map:signTex,transparent:true}));signFace.position.set(0,.74,3.47);signFace.rotation.x=-.03;cake.add(signFace);
// 暖金烛光
scene.add(new THREE.HemisphereLight(0xffe9dc,0x210e15,1.35));const key=new THREE.PointLight(0xffbd5e,75,28,2);key.position.set(0,6.5,6);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const pinkLight=new THREE.PointLight(0xff5795,42,25,2);pinkLight.position.set(-6,3,2);scene.add(pinkLight);const goldLight=new THREE.PointLight(0xffd777,34,25,2);goldLight.position.set(6,4,-3);scene.add(goldLight);
const floor=new THREE.Mesh(new THREE.CircleGeometry(10,64),new THREE.MeshBasicMaterial({color:0x5d2035,transparent:true,opacity:.34}));floor.rotation.x=-Math.PI/2;floor.position.y=-.05;scene.add(floor);
// 彩色糖粒与金色闪烁粒子
const N=900,pos=new Float32Array(N*3),colors=new Float32Array(N*3),pal=[new THREE.Color(0xff9fbe),new THREE.Color(0xffd56c),new THREE.Color(0xfff1df),new THREE.Color(0xdba4ff)];for(let i=0;i<N;i++){const a=Math.random()*Math.PI*2,r=3.5+Math.random()*8;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=-.1+Math.random()*8;pos[i*3+2]=Math.sin(a)*r*.75;const c=pal[i%pal.length];colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(colors,3));particlesGroup.add(new THREE.Points(pg,new THREE.PointsMaterial({size:.055,vertexColors:true,transparent:true,opacity:.8,blending:THREE.AdditiveBlending})));
const SN=180,sp=new Float32Array(SN*3);for(let i=0;i<SN;i++){const a=Math.random()*Math.PI*2,r=3+Math.random()*7;sp[i*3]=Math.cos(a)*r;sp[i*3+1]=Math.random()*7;sp[i*3+2]=Math.sin(a)*r*.75}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));sparkGroup.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffd76b,size:.075,transparent:true,opacity:.9,blending:THREE.AdditiveBlending})));
// 照片卡片
const PHOTO_DATA=['assets/IMG_1313.webp','assets/IMG_1504.webp','assets/IMG_1757.webp','assets/IMG_2147.webp','assets/IMG_2244.webp','assets/IMG_2350.webp','assets/IMG_2423.webp','assets/IMG_2592.webp','assets/IMG_2700.webp','assets/IMG_3019.webp','assets/contact.webp'];const photos=[];
function cloudTarget(i){const a=i*2.399+.4,r=5.2+Math.random()*4.8;return{x:Math.cos(a)*r,y:-.3+Math.random()*7,z:Math.sin(a)*r*.72,rx:(Math.random()-.5)*.65,ry:(Math.random()-.5)*.7,rz:(Math.random()-.5)*.45,s:.78+Math.random()*.18}}
function cakeTarget(i){const a=i*1.72,r=3.7+(i%3)*.35;return{x:Math.cos(a)*r*.62,y:.25+(i%4)*.72,z:Math.sin(a)*r*.52,rx:(Math.random()-.5)*.2,ry:(Math.random()-.5)*.4,rz:(Math.random()-.5)*.25,s:.5}}
function makeCard(src,index){const g=new THREE.Group();const frame=new THREE.Mesh(new THREE.BoxGeometry(2.55,1.92,.12),new THREE.MeshPhysicalMaterial({color:0xfff8ef,roughness:.28,clearcoat:.42,transparent:true,opacity:.96}));g.add(frame);const mat=new THREE.MeshBasicMaterial({color:0xffd6e0,transparent:true,side:THREE.DoubleSide});const img=new THREE.Mesh(new THREE.PlaneGeometry(2.34,1.71),mat);img.position.z=.071;g.add(img);g.userData={index,mat,frame,seed:Math.random()*10,cloud:cloudTarget(index),cake:cakeTarget(index)};photosGroup.add(g);photos.push(g);const image=new Image();image.decoding='async';image.onload=()=>{const t=new THREE.Texture(image);t.needsUpdate=true;t.colorSpace=THREE.SRGBColorSpace;mat.map=t;mat.color.set(0xffffff);mat.needsUpdate=true};image.onerror=()=>{const c=document.createElement('canvas');c.width=600;c.height=420;const q=c.getContext('2d');q.fillStyle='#f6c5d4';q.fillRect(0,0,600,420);q.fillStyle='#fff7ee';q.font='bold 34px sans-serif';q.textAlign='center';q.fillText('JIXUANHANG',300,205);q.font='22px sans-serif';q.fillText('Birthday Memory',300,245);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;mat.map=t;mat.color.set(0xffffff);mat.needsUpdate=true};image.src=src;return g}
PHOTO_DATA.forEach((s,i)=>{const p=makeCard(s,i);p.scale.setScalar(.01)});
let state='cake',selected=null,lastHand={x:.5,y:.5},lastGesture='none',stableSince=0;const labels={cake:'蛋糕展示态 · 握拳回到这里',cloud:'照片云散开态 · 张开五指',focus:'照片放大态 · 松开捏合返回'};
function moveCard(p,t,d=.8,m=1){gsap.to(p.position,{x:t.x,y:t.y,z:t.z,duration:d,ease:'power3.inOut'});gsap.to(p.rotation,{x:t.rx,y:t.ry,z:t.rz,duration:d,ease:'power3.inOut'});gsap.to(p.scale,{x:t.s*m,y:t.s*m,z:t.s*m,duration:d,ease:'back.out(1.15)'})}
function setState(next,pick=null){if(next===state&&pick===selected)return;state=next;if(pick!==null)selected=pick;statePill.textContent=labels[state];if(state==='cake'){selected=null;world.rotation.set(0,0,0);photos.forEach(p=>moveCard(p,p.userData.cake,.72,1));gsap.to(particlesGroup.scale,{x:.7,y:.7,z:.7,duration:.8})}else if(state==='cloud'){selected=null;photos.forEach(p=>moveCard(p,p.userData.cloud,.85,1));gsap.to(particlesGroup.scale,{x:1.45,y:1.45,z:1.45,duration:.8})}else{if(selected===null)selected=pick??0;photos.forEach((p,i)=>{if(i===selected){gsap.to(p.position,{x:0,y:1.15,z:5.6,duration:.85,ease:'power3.out'});gsap.to(p.rotation,{x:0,y:0,z:0,duration:.85});gsap.to(p.scale,{x:1.72,y:1.72,z:1.72,duration:.85,ease:'power3.out'});gsap.to(p.userData.mat,{opacity:1,duration:.5});gsap.to(p.userData.frame.material,{opacity:1,duration:.5})}else{moveCard(p,p.userData.cloud,.85,.72);gsap.to(p.userData.mat,{opacity:.28,duration:.5});gsap.to(p.userData.frame.material,{opacity:.3,duration:.5})}})}}
setState('cake');
document.querySelector('#upload').addEventListener('change',e=>{[...e.target.files].forEach(file=>{const reader=new FileReader();reader.onload=ev=>{const p=makeCard(ev.target.result,photos.length);if(state==='cake')setState('cloud');else moveCard(p,p.userData.cloud,.7,1)};reader.readAsDataURL(file)});e.target.value='' });
document.querySelector('#resetBtn').onclick=()=>setState('cake');
let dragging=false,mx=0,my=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;mx=e.clientX;my=e.clientY});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(!dragging||state!=='cloud')return;world.rotation.y+=(e.clientX-mx)*.004;world.rotation.x+=(e.clientY-my)*.002;mx=e.clientX;my=e.clientY});
renderer.domElement.addEventListener('click',e=>{if(state!=='cloud')return;const r=renderer.domElement.getBoundingClientRect(),ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-(((e.clientY-r.top)/r.height)*2-1)),ray=new THREE.Raycaster();ray.setFromCamera(ndc,camera);const hits=ray.intersectObjects(photos,true);if(hits.length){let o=hits[0].object;while(o.parent&&o.userData.index===undefined)o=o.parent;if(Number.isInteger(o.userData.index))setState('focus',o.userData.index)}});
let hands=null,mpCam=null;async function startHands(){if(!window.Hands||!window.Camera){alert('手势组件加载失败，请刷新页面');return}hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.58,minTrackingConfidence:.58});hands.onResults(onHands);mpCam=new Camera(video,{onFrame:async()=>hands.send({image:video}),width:640,height:480});await mpCam.start();document.querySelector('#camBtn').textContent='手势控制已开启'}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function classify(lm){const wrist=lm[0],tips=[8,12,16,20],pips=[6,10,14,18];const ext=tips.map((t,i)=>d(lm[t],wrist)>d(lm[pips[i]],wrist)*1.12).filter(Boolean).length;const pinch=d(lm[4],lm[8])<.065;if(pinch)return{type:'pinch',x:lm[8].x,y:lm[8].y};if(ext<=1)return{type:'fist',x:wrist.x,y:wrist.y};if(ext>=4)return{type:'open',x:wrist.x,y:wrist.y};return{type:'move',x:wrist.x,y:wrist.y}}
function onHands(res){const lm=res.multiHandLandmarks&&res.multiHandLandmarks[0];if(!lm){dot.style.display='none';return}dot.style.display='block';const g=classify(lm),now=performance.now();dot.style.left=(1-g.x)*innerWidth+'px';dot.style.top=g.y*innerHeight+'px';if(g.type!==lastGesture){lastGesture=g.type;stableSince=now}const stable=now-stableSince>180;if(g.type==='open'&&stable&&state==='cake')setState('cloud');else if(g.type==='fist'&&stable&&state!=='cake')setState('cake');else if(g.type==='pinch'&&stable&&state==='cloud'){let best=Infinity,bi=0;photos.forEach((p,i)=>{const v=p.position.clone().project(camera),dx=v.x*.5+.5-(1-g.x),dy=v.y*-.5+.5-g.y,dd=Math.hypot(dx,dy);if(dd<best){best=dd;bi=i}});if(best<.36)setState('focus',bi)}else if(g.type==='open'&&state==='cloud'){world.rotation.y+=(g.x-lastHand.x)*2.2;world.rotation.x+=(g.y-lastHand.y)*1.05}else if(g.type==='pinch'&&state==='focus'){const p=photos[selected];if(p)gsap.to(p.position,{x:(.5-g.x)*4.8,y:(.5-g.y)*2.8+1.15,duration:.18,ease:'power2.out'})}else if(g.type==='move'&&state==='cloud'){world.rotation.y+=(g.x-lastHand.x)*1.35;world.rotation.x+=(g.y-lastHand.y)*.65}else if(g.type!=='pinch'&&state==='focus'&&stable)setState('cloud');lastHand={x:g.x,y:g.y}}
document.querySelector('#camBtn').onclick=()=>startHands().catch(err=>alert('无法开启摄像头：'+err.message));
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();cake.rotation.y=Math.sin(t*.12)*.035;particlesGroup.rotation.y=t*.012;sparkGroup.rotation.y=-t*.06;key.intensity=70+Math.sin(t*7)*6+Math.sin(t*13)*3;candles.forEach(f=>{f.scale.x=.7+Math.sin(t*8+f.userData.phase)*.09;f.scale.y=1.55+Math.sin(t*10+f.userData.phase)*.13});photos.forEach(p=>{if(state==='cloud'){p.position.y+=Math.sin(t*.55+p.userData.seed)*.0015;p.rotation.z+=Math.sin(t*.3+p.userData.seed)*.00015}});renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
// 不等待照片、字体或摄像头，Three.js 初始化完成后立即移除加载层，避免再次卡在“正在点亮生日场景”。
setTimeout(()=>loading.classList.add('hide'),250);animate();
})();
</script>
</body>
</html>
