ker .7s infinite alternate;filter:drop-shadow(0 0 12px #ffc34d)}@keyframes flicker{to{transform:scale(1.12) rotate(4deg)}}.f1{left:38.5%}.f2{left:48.5%}.f3{left:58.5%}.plate{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:95%;padding:12px 18px;border-radius:14px;background:linear-gradient(#ffe38a,#b87319);color:#5a2a13;font-weight:900;text-align:center;font-size:clamp(12px,2.2vw,20px);letter-spacing:.04em;box-shadow:0 5px 12px #0008,inset 0 2px #fff9}.photos{position:absolute;inset:0;pointer-events:none}.photo{position:absolute;width:120px;height:90px;padding:6px;background:#fff;box-shadow:0 8px 22px #0009;border-radius:5px;transform:rotate(var(--r));animation:float 4s ease-in-out infinite}.photo img{width:100%;height:100%;object-fit:cover}.p1{left:7%;top:20%;--r:-8deg}.p2{right:7%;top:18%;--r:9deg}.p3{left:12%;bottom:18%;--r:6deg}.p4{right:12%;bottom:17%;--r:-7deg}.p5{left:3%;top:48%;--r:-3deg}.p6{right:3%;top:47%;--r:5deg}@keyframes float{50%{margin-top:-12px;transform:rotate(var(--r)) scale(1.03)}}.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd76a;box-shadow:0 0 12px 3px #ffd76a;animation:twinkle 1.5s infinite alternate}.s{left:var(--x);top:var(--y);animation-delay:var(--d)}@keyframes twinkle{to{opacity:.15;transform:scale(.3)}}#ui{position:fixed;inset:0;z-index:5;pointer-events:none}.title{position:absolute;left:24px;top:20px}.brand{font-size:11px;letter-spacing:.25em;color:#ffd993}.title h1{margin:7px 0;font-size:clamp(25px,4vw,46px)}.title p{margin:0;color:#ffdbe6;font-size:12px}.pill{position:absolute;right:20px;top:20px;padding:10px 15px;border:1px solid #ffffff33;border-radius:30px;background:#351522aa;backdrop-filter:blur(10px);font-size:12px}.buttons{position:absolute;left:20px;bottom:20px;pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap}button,label{padding:10px 14px;border:1px solid #ffffff44;border-radius:30px;background:#351522dd;color:#fff;cursor:pointer;font-size:12px}input{display:none}.hint{position:absolute;right:20px;bottom:20px;text-align:right;font-size:11px;line-height:1.7;color:#ffe5e8}.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle,#672c42,#14080e 70%);transition:.5s}.loading.hide{opacity:0;visibility:hidden}.loading div{text-align:center}.loading b{font-size:65px;display:block}.loading span{font-size:13px;color:#ffe6d7}.error{display:none!important}</style></head><body><div id="app"><div id="fallback"><div class="photos" id="photos"></div><div class="cake"><div class="tier t1"><div class="drip"></div></div><div class="tier t2"><div class="drip"></div></div><div class="tier t3"><div class="drip"></div></div><i class="straw s1"></i><i class="straw s2"></i><i class="straw s3"></i><i class="candle c1"></i><i class="candle c2"></i><i class="candle c3"></i><i class="flame f1"></i><i class="flame f2"></i><i class="flame f3"></i><div class="plate">HAPPY BIRTHDAY JIXUANHANG</div></div></div></div><div id="ui"><div class="title"><div class="brand">JIXUANHANG · BIRTHDAY MEMORY</div><h1>Happy Birthday ✦</h1><p>让照片、烛光和回忆一起漂浮起来</p></div><div class="pill" id="state">蛋糕展示态 · 握拳回到这里</div><div class="buttons"><button id="cam">开启手势控制</button><label>添加照片<input id="upload" type="file" accept="image/*" multiple></label><button id="reset">回到蛋糕</button></div><div class="hint">五指张开：照片云散开<br>移动手掌：旋转场景<br>拇指＋食指捏合：放大照片</div></div><div class="loading" id="loading"><div><b>🎂</b><span>正在点亮生日场景…</span></div></div><script>const files=['IMG_1313.webp','IMG_1504.webp','IMG_1757.webp','IMG_2147.webp','IMG_2244.webp','IMG_2350.webp','IMG_2423.webp','IMG_2592.webp','IMG_2700.webp'];const photos=document.getElementById('photos');files.slice(0,6).forEach((f,i)=>{const d=document.createElement('div');d.className='photo p'+(i+1);const im=new Image();im.src='assets/'+f;d.appendChild(im);photos.appendChild(d)});for(let i=0;i<45;i++){let s=document.createElement('i');s.className='spark s';s.style.setProperty('--x',Math.random()*100+'%');s.style.setProperty('--y',Math.random()*100+'%');s.style.setProperty('--d',Math.random()*2+'s');document.getElementById('fallback').appendChild(s)}setTimeout(()=>document.getElementById('loading').classList.add('hide'),900);document.getElementById('reset').onclick=()=>{document.getElementById('state').textContent='蛋糕展示态 · 握拳回到这里';photos.style.transform='';};document.getElementById('upload').onchange=e=>{[...e.target.files].slice(0,12).forEach((f,i)=>{const d=document.createElement('div');d.className='photo';d.style.left=(8+Math.random()*78)+'%';d.style.top=(10+Math.random()*72)+'%';d.style.setProperty('--r',(Math.random()*18-9)+'deg');const im=new Image();im.src=URL.createObjectURL(f);d.appendChild(im);photos.appendChild(d)});document.getElementById('state').textContent='照片云散开态 · 可浏览照片'};document.getElementById('cam').onclick=()=>{document.getElementById('state').textContent='手势控制准备中 · 当前网络下仍可正常浏览';};let startX=0;document.getElementById('fallback').addEventListener('pointerdown',e=>startX=e.clientX);document.getElementById('fallback').addEventListener('pointermove',e=>{if(e.buttons){photos.style.transform='translateX('+(e.clientX-startX)*.35+'px)'}});</script></body></html>
