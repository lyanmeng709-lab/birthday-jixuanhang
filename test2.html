<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Particle Test v2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020106;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.cover{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle at 50% 48%,#250b21,#08030d 58%,#020106);transition:opacity .7s}.cover.hide{opacity:0;pointer-events:none}.panel{text-align:center}.ey{font-size:10px;letter-spacing:.42em;color:#ffc7e7}.panel h1{font-size:clamp(36px,6.5vw,78px);font-weight:200;letter-spacing:.12em;margin:14px 0 10px;text-shadow:0 0 30px #ff62bb}.panel p{font-size:12px;color:#cbb6c6;margin:0 0 26px}.panel button{border:1px solid #ffacd888;background:#ff59b518;color:#fff;border-radius:999px;padding:13px 28px;letter-spacing:.14em;cursor:pointer;box-shadow:0 0 34px #ff59b533}.hud{position:fixed;inset:0;z-index:2;pointer-events:none}.brand{position:absolute;top:16px;left:50%;transform:translateX(-50%);text-align:center;letter-spacing:.15em;text-shadow:0 0 24px #ff8fcd}.brand small{font-size:9px;color:#f4bedc}.brand b{display:block;font-size:24px;font-weight:300;margin-top:4px}.status{position:absolute;top:16px;right:16px;padding:7px 11px;border:1px solid #ffb2dc44;border-radius:20px;background:#100713aa;color:#f5c9df;font-size:10px}.hint{position:absolute;right:16px;bottom:16px;text-align:right;color:#c4b1bf;font-size:10px;line-height:1.8}.reset{position:absolute;bottom:16px;left:16px;pointer-events:auto;border:1px solid #ffb2dc44;border-radius:20px;background:#100713dd;color:#fff;padding:8px 12px;font-size:10px}</style></head><body><canvas id="scene"></canvas><div id="cover" class="cover"><div class="panel"><div class="ey">JIXUANHANG · MEMORY UNIVERSE</div><h1>HAPPY BIRTHDAY</h1><p>参考图风格测试版 · 数字 / 爆散 / 蛋糕</p><button id="start">点亮生日星云 ★</button></div></div><div class="hud"><div class="brand"><small>JIXUANHANG · MEMORY UNIVERSE</small><b>HAPPY BIRTHDAY</b></div><div class="status" id="status">等待点亮</div><button class="reset" id="reset">重新开始</button><div class="hint">滚轮：拉近 / 拉远　·　拖动：旋转<br>测试版：先看数字、爆散、蛋糕视觉</div></div><audio id="audio" preload="auto" src="audio/birthday.mp3"></audio><script>(()=>{const c=document.getElementById('scene'),ctx=c.getContext('2d',{alpha:false}),cover=document.getElementById('cover'),start=document.getElementById('start'),status=document.getElementById('status'),audio=document.getElementById('audio');let W=0,H=0,D=1,phase='idle',phaseT=0,num=5,rot=0,zoom=1,drag=false,lx=0,ty=0,time=0;const TAU=Math.PI*2,C=['#fffdfd','#ffe6f0','#ffb6dc','#ff88c8','#ffd993','#f2d7ff'];const digits={5:'900 520px Georgia,"Times New Roman",serif',4:'900 520px Georgia,"Times New Roman",serif',3:'900 520px Georgia,"Times New Roman",serif',2:'900 520px Georgia,"Times New Roman",serif',1:'900 540px Georgia,"Times New Roman",serif'};let particles=[],burst=[],cake=[],title=[];function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function clamp(v){return Math.max(0,Math.min(1,v))}function ease(v){return v*v*(3-2*v)}function project(p){const cy=Math.cos(rot),sy=Math.sin(rot),X=p.x*cy-p.z*sy,Z=p.x*sy+p.z*cy,s=Math.min(W,H)*.18*zoom/(1+Z/10);return{x:W/2+X*s,y:H*.55-p.y*s,z:Z}}function background(){const g=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.8);g.addColorStop(0,'#19091e');g.addColorStop(.44,'#09040f');g.addColorStop(1,'#020106');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<220;i++){ctx.globalAlpha=.06+.06*Math.sin(time*.8+i);ctx.fillStyle=i%7?'#ffb8dc':'#ffe7b0';ctx.fillRect((i*83%997)/997*W,(i*47%991)/991*H,1,1)}ctx.globalAlpha=1}function particle(x,y,s,col,a){ctx.globalAlpha=a;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,s,0,TAU);ctx.fill()}function makeDigit(n){const q=document.createElement('canvas');q.width=700;q.height=820;const g=q.getContext('2d');g.clearRect(0,0,700,820);g.fillStyle='#fff';g.font=digits[n];g.textAlign='center';g.textBaseline='middle';g.fillText(String(n),350,425);const d=g.getImageData(0,0,700,820).data,pts=[];for(let y=30;y<790;y+=3)for(let x=30;x<670;x+=3)if(d[(y*700+x)*4+3]>110)pts.push({x:(x-350)/105,y:(425-y)/105});particles=[];for(let i=0;i<6800;i++){const p=pts[(i*23+Math.floor(i/71))%pts.length],a=Math.random()*TAU,r=4.6+Math.random()*2.7;particles.push({sx:Math.cos(a)*r,sy:Math.sin(a)*r*.72,tx:p.x+(Math.random()-.5)*.018,ty:p.y+(Math.random()-.5)*.018,z:(Math.random()-.5)*.4,tz:(Math.random()-.5)*.06,size:.55+Math.random()*.55,col:C[i%6],tw:Math.random()*TAU})}}function drawDigit(){const u=ease(clamp((performance.now()-phaseT)/850));ctx.save();ctx.globalCompositeOperation='lighter';for(const p of particles){const q=project({x:p.sx+(p.tx-p.sx)*u,y:p.sy+(p.ty-p.sy)*u,z:p.z+(p.tz-p.z)*u});particle(q.x,q.y,p.size,p.col,.82+.15*Math.sin(time*2+p.tw))}ctx.restore()}function buildBurst(){burst=Array.from({length:2600},(_,i)=>{const a=Math.random()*TAU,spread=.5+Math.random()*2.2;return{a,r:Math.random()*1.1,spread,size:.35+Math.random()*.8,col:C[i%6],speed:.8+Math.random()*1.8}})}function drawBurst(){const u=clamp((performance.now()-phaseT)/1100);ctx.save();ctx.globalCompositeOperation='lighter';for(const p of burst){const r=p.r*(1-u)+p.spread*(.2+u*5.4)+Math.sin(p.a*8+time*4)*.12;const q=project({x:Math.cos(p.a)*r,y:Math.sin(p.a)*r*.78,z:Math.sin(p.a*2+time)*.6});particle(q.x,q.y,p.size,p.col,.55*(1-u)+.75*(u<.3?1:1-u*.15))}for(let i=0;i<40;i++){const a=Math.random()*TAU,r=Math.random()*1.1;const q=project({x:Math.cos(a)*r,y:Math.sin(a)*r,z:Math.cos(a*3)*.2});particle(q.x,q.y,1.8,'#fff9df',.85)}ctx.restore()}function addTier(r,y,h,n,col){for(let i=0;i<n;i++){const a=Math.random()*TAU,rr=r*Math.sqrt(Math.random());cake.push({x:Math.cos(a)*rr,y:y+(Math.random()-.5)*h,z:Math.sin(a)*rr,size:.38+Math.random()*.5,col})}for(let ring=0;ring<4;ring++)for(let i=0;i<520;i++){const a=i*TAU/520,rr=r+.015*ring;cake.push({x:Math.cos(a)*rr,y:y+h*.48-ring*.025+Math.sin(a*10)*.035,z:Math.sin(a)*rr,size:.32+Math.random()*.3,col:ring===1?'#fff7fb':ring===2?'#ffd2e8':'#fff'})}}function buildCake(){cake=[];addTier(2.1,-1.18,.66,4600,'#fff3f7');addTier(1.56,-.48,.58,3800,'#ffe2ed');addTier(1.08,.16,.52,3000,'#fff9fc');for(let i=0;i<30;i++){const a=Math.random()*TAU,rr=[1.5,1.02][i%2],y=[.03,.58][i%2];for(let j=0;j<45;j++){const r=.11*Math.sqrt(Math.random());cake.push({x:Math.cos(a)*rr+Math.cos(a)*r,y:y+Math.random()*.20,z:Math.sin(a)*rr+Math.sin(a)*r,size:.55+Math.random()*.5,col:'#ff6d9f'})}}for(let i=0;i<7;i++){const a=i*TAU/7,r=.64;for(let j=0;j<150;j++)cake.push({x:Math.cos(a)*r+(Math.random()-.5)*.025,y:.74+j*.0038,z:Math.sin(a)*r+(Math.random()-.5)*.025,size:.45+Math.random()*.4,col:j%3?'#f7bdd5':'#ffd76b'});for(let j=0;j<90;j++)cake.push({x:Math.cos(a)*r+(Math.random()-.5)*.10,y:1.28+Math.random()*.25,z:Math.sin(a)*r+(Math.random()-.5)*.10,size:.45+Math.random()*.45,col:'#ffd66d'})}title=[];const q=document.createElement('canvas');q.width=1400;q.height=180;const g=q.getContext('2d');g.fillStyle='#fff';g.font='900 72px Georgia,"Times New Roman",serif';g.textAlign='center';g.textBaseline='middle';g.fillText('HAPPY BIRTHDAY JIXUANHANG',700,90);const d=g.getImageData(0,0,1400,180).data;for(let y=0;y<180;y+=3)for(let x=0;x<1400;x+=3)if(d[(y*1400+x)*4+3]>100)title.push({x:(x-700)/185,y:-.86,z:(y-90)/55-2.65,size:.65,col:'#ffe6a6'});}function drawCake(){const u=ease(clamp((performance.now()-phaseT)/1900));ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<cake.length;i++){const p=cake[i],a=i*.37+u*4,r0=3.9*(1-u),r1=Math.hypot(p.x,p.z);const q=project({x:Math.cos(a)*r0*(1-u)+p.x*u,y:p.y*u+Math.sin(a*1.7)*1.5*(1-u),z:Math.sin(a)*r0*(1-u)+p.z*u});particle(q.x,q.y,p.size,p.col,.55+.25*u)}for(const p of title){const q=project(p);particle(q.x,q.y,p.size,p.col,.95)}ctx.restore()}function drawDone(){ctx.save();ctx.globalCompositeOperation='lighter';cake.forEach(p=>{const q=project(p);particle(q.x,q.y,p.size,p.col,.7)});title.forEach(p=>{const q=project(p);particle(q.x,q.y,p.size,p.col,1)});ctx.restore()}function startShow(){if(phase!=='idle')return;audio.currentTime=0;audio.muted=true;audio.play().catch(()=>{});cover.classList.add('hide');num=5;makeDigit(num);buildBurst();buildCake();phase='count';phaseT=performance.now();status.textContent='粒子倒数 · 5'}start.onclick=startShow;document.getElementById('reset').onclick=()=>location.reload();c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(1.9,zoom*(e.deltaY>0?.92:1.09)))},{passive:false});c.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ty=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;rot+=(e.clientX-lx)*.004;lx=e.clientX;ty=e.clientY});c.addEventListener('pointerup',()=>drag=false);function loop(now){time+=.016;background();if(phase==='count'){drawDigit();if(now-phaseT>1250){if(num>1){num--;makeDigit(num);phaseT=now;status.textContent='粒子倒数 · '+num}else{phase='burst';phaseT=now;status.textContent='粒子爆散'}}}else if(phase==='burst'){drawBurst();if(now-phaseT>1120){phase='cake';phaseT=now;status.textContent='蛋糕 · 粒子聚合'}}else if(phase==='cake'){drawCake();if(now-phaseT>1950){phase='done';audio.currentTime=0;audio.muted=false;audio.play().catch(()=>{});status.textContent='生日快乐 · 音乐播放'}}else if(phase==='done')drawDone();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
