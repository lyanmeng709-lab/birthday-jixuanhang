name: Fix CDN sources

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-cdn:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch CDN
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js', 'https://unpkg.com/three@0.161.0/build/three.min.js')
          s = s.replace('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js', 'https://unpkg.com/@mediapipe/hands@0.4/hands.js')
          s = s.replace('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js', 'https://unpkg.com/@mediapipe/camera_utils@0.3/camera_utils.js')
          s = s.replace("https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/", "https://unpkg.com/@mediapipe/hands@0.4/")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: use unpkg CDN for browser dependencies [skip ci]' && git push)
